# Single dev stack for the whole project — backend and frontend live in one
# repo (backend/, frontend/) and come up together from here.
#
# Usage:
#   docker compose up --build
#
# That starts: db, redis, api, worker, beat, web. `web` talks to the real
# `api` by default (NEXT_PUBLIC_API_URL below).
#
# Object storage (MinIO) is commented out below -- backend/ currently uses
# local filesystem storage (see backend/config/settings/base.py). Uncomment
# the `minio` service and its `depends_on` entries (api/worker/beat) once
# you're ready to re-enable S3-compatible storage, whether that's this
# local MinIO container or pointing straight at a paid managed S3 account.
#
# Frontend-only mode: if you want to work on the UI without the full
# Django/Postgres/Celery stack, bring up just `web` + the Prism mock
# (reads contracts/openapi.yaml) via the `mock` profile instead:
#   docker compose --profile mock up mock-api
#   NEXT_PUBLIC_API_URL=http://localhost:4010 docker compose up web
#
# Testing real Chapa sandbox payments: Chapa's webhook needs a public URL
# to POST to, which `localhost` can't provide. A free ngrok static domain
# gives `api` a permanent public URL that never changes -- see the
# `ngrok` service below for one-time setup, then:
#   docker compose --profile tunnel up -d ngrok

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: museum_ticketing
      POSTGRES_PASSWORD: museum_ticketing
      POSTGRES_DB: museum_ticketing
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U museum_ticketing"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Object storage -- DISABLED for now (see note above). To bring it back:
  #   1. Uncomment this service
  #   2. Uncomment `minio_data` in the volumes: block at the bottom
  #   3. Add a `minio: condition: service_healthy` entry to api's
  #      depends_on below (worker/beat don't need it directly)
  #   4. Re-enable the S3 settings in backend/config/settings/base.py and
  #      requirements/base.txt (see comments there)
  #
  # minio:
  #   image: minio/minio:latest
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: museum_ticketing
  #     MINIO_ROOT_PASSWORD: museum_ticketing
  #   ports:
  #     - "9000:9000"   # S3 API
  #     - "9001:9001"   # Console
  #   volumes:
  #     - minio_data:/data
  #   healthcheck:
  #     test: ["CMD", "mc", "ready", "local"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

  api:
    build:
      context: ./backend
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - ./contracts:/contracts
      - .:/workspace
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/admin/')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # minio:
      #   condition: service_healthy

  worker:
    build:
      context: ./backend
    # Sec 6.1-6.2: one worker consuming all three queues locally is enough
    # for dev; production scales each queue's replica pool independently
    # (Document 08 Sec 2.1/7.2).
    command: celery -A config worker -l info -Q notifications,documents,payments
    volumes:
      - ./backend:/app
      - .:/workspace
    env_file:
      - ./backend/.env
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./backend
    # Exactly one replica -- never scale this service (ADR-003).
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app
      - .:/workspace
    env_file:
      - ./backend/.env
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    volumes:
      - ./frontend:/app
      - ./contracts:/contracts
      - /app/node_modules
      - /app/.next
      - .:/workspace
    env_file:
      - ./frontend/.env.local
    environment:
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    depends_on:
      - api

  # ngrok -- gives `api` a fixed, permanent public https:// URL (a free
  # static domain, e.g. https://your-name.ngrok-free.app) so Chapa's
  # sandbox webhook always has somewhere stable to POST to. Unlike the
  # Cloudflare Quick Tunnel this replaces, this URL never rotates -- set
  # it once in backend/.env and once in Chapa's dashboard Webhook URL
  # field, and neither ever needs touching again.
  #
  # One-time setup:
  #   1. Sign up free at https://ngrok.com, copy your authtoken (dashboard
  #      > Your Authtoken).
  #   2. Reserve a free static domain: dashboard > Universal Edge >
  #      Domains > "+ New Domain". You get one free, e.g.
  #      your-name.ngrok-free.app.
  #   3. Create a `.env` file in the REPO ROOT (a different file from
  #      backend/.env -- this one is read by docker-compose.yml itself)
  #      containing:
  #        NGROK_AUTHTOKEN=<your authtoken>
  #        NGROK_STATIC_DOMAIN=<your-name>.ngrok-free.app
  #   4. In backend/.env, set:
  #        PUBLIC_API_BASE_URL=https://<your-name>.ngrok-free.app
  #   5. In Chapa's dashboard (profile > Webhooks), set Webhook URL to:
  #        https://<your-name>.ngrok-free.app/api/v1/payments/webhooks/chapa/
  #      and Secret hash to match CHAPA_WEBHOOK_SECRET in backend/.env.
  #
  # Start it with: docker compose --profile tunnel up -d ngrok
  # (requires --force-recreate on `api` the first time you set
  # PUBLIC_API_BASE_URL, same as any other env_file change -- see the
  # comment on the `api` service's env_file above for why plain
  # `restart` doesn't pick up .env edits.)
  ngrok:
    image: ngrok/ngrok:latest
    command:
      - "http"
      - "http://api:8000"
      - "--url=https://${NGROK_STATIC_DOMAIN}"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      api:
        condition: service_healthy
    profiles:
      - tunnel

  # Optional: Stoplight Prism, reads contracts/openapi.yaml and serves
  # realistic, schema-valid mock responses on port 4010 — for frontend work
  # that doesn't need the full backend stack running. Not started by
  # default; requires --profile mock (see usage note above).
  mock-api:
    image: stoplight/prism:5
    command: mock -h 0.0.0.0 --multiprocess=false /contracts/openapi.yaml
    volumes:
      - ./contracts:/contracts
    ports:
      - "4010:4010"
    profiles:
      - mock

volumes:
  db_data:
  # minio_data: