name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: backend

env:
  DJANGO_SETTINGS_MODULE: config.settings.development
  SECRET_KEY: ci-only-not-a-real-secret
  ALLOWED_HOSTS: "*"
  DATABASE_URL: postgres://museum_ticketing:museum_ticketing@localhost:5432/museum_ticketing
  REDIS_URL: redis://localhost:6379
  CORS_ALLOWED_ORIGINS: http://localhost:3000
  FISCAL_YEAR_START_MONTH: "7"
  FISCAL_YEAR_START_DAY: "1"
  EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
  # Sec 3's Chapa/finance settings have no defaults in base.py (fail fast
  # in every real environment) -- CI needs placeholder values to import
  # settings at all, same as any other required-but-secret-in-prod var.
  FINANCE_BANK_ACCOUNT_NAME: CI Placeholder
  FINANCE_BANK_ACCOUNT_NUMBER: "0000000000"
  FINANCE_BANK_CODE: "000"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: museum_ticketing
          POSTGRES_PASSWORD: museum_ticketing
          POSTGRES_DB: museum_ticketing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U museum_ticketing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/development.txt

      - name: Install dependencies
        run: pip install -r requirements/development.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        run: pytest --cov=apps --cov-report=term-missing --cov-report=xml

      - name: Contract drift check
        run: |
          ./scripts/export_contract.sh
          git diff --exit-code -- ../contracts/openapi.yaml