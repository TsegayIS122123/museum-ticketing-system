      tags:
      - v1
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingList'
          description: ''
  /api/v1/admin/audit-log/:
    get:
      operationId: listAuditLog
      description: |-
        GET /admin/audit-log -- Platform Admin only, read-only (FR-AUDIT-001).
        Returns the append-only audit trail written across every module,
        filterable and paginated.
      parameters:
      - name: actor
        required: false
        in: query
        description: Filter by acting account UUID.
        schema:
          type: string
          format: uuid
      - name: action
        required: false
        in: query
        description: Filter by action, e.g. `booking.cancelled`.
        schema:
          type: string
      - name: entityType
        required: false
        in: query
        schema:
          type: string
      - name: entityId
        required: false
        in: query
        schema:
          type: string
      - name: from
        required: false
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        required: false
        in: query
        schema:
          type: string
          format: date-time
      - name: limit
        required: false
        in: query
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        schema:
          type: integer
      tags:
      - Admin
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type: string
                    nullable: true
                  previous:
                    type: string
                    nullable: true
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLogEntry'
          description: ''
  /api/v1/notifications/preferences/:
    get:
      operationId: getNotificationPreferences
      description: GET /notifications/preferences -- the caller's notification channels and language (FR-NOTIFY-PREF-001).
      tags:
      - Notifications
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreference'
          description: ''
    put:
      operationId: updateNotificationPreferences
      description: PUT /notifications/preferences -- replaces the caller's preferences (FR-NOTIFY-PREF-001).
      tags:
      - Notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreference'
        required: true
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreference'
          description: ''
  /api/v1/notifications/devices/:
    post:
      operationId: registerDevice
      description: POST /notifications/devices -- register a device token for push delivery (FR-NOTIFY-PUSH-001).
      tags:
      - Notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceToken'
        required: true
      security:
      - TokenVersionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceToken'
          description: ''
  /api/v1/notifications/devices/{token}/:
    delete:
      operationId: unregisterDevice
      description: DELETE /notifications/devices/{token} -- deactivate a registered device token.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - Notifications
      security:
      - TokenVersionAuth: []
      responses:
        '204':
          description: ''
components:
  parameters:
    XClientPlatform:
      name: X-Client-Platform
      in: header
      required: false
      description: |-
        Declares the calling client platform. Defaults to `web`; a native
        client sends `expo`, which opts it into refresh-token delivery in the
        response body instead of an httpOnly cookie (ADR-013).
      schema:
        type: string
        enum: [web, expo]
        default: web
  schemas:
    Account:
      type: object
      description: |-
        `UserProfile` (Document 04) -- Visitor and Staff share one shape; a
        Visitor's password-adjacent fields are simply never populated.

        `email_verified_at`/`phone_verified_at` are exposed (read-only) so the
        frontend can gate a Visitor's flow -- e.g. requiring email verification
        right after OTP confirmation (FR-ACC-003) -- without having to guess at
        verification state or discover it only when a later action (like
        `create_booking`) rejects it.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
          nullable: true
        full_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/AccountRoleEnum'
          readOnly: true
        language_preference:
          allOf:
          - $ref: '#/components/schemas/LanguagePreferenceEnum'
          readOnly: true
        active:
          type: boolean
          readOnly: true
        email_verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        phone_verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - active
      - created_at
      - email
      - email_verified_at
      - full_name
      - id
      - language_preference
      - phone
      - phone_verified_at
      - role
    AccountRoleEnum:
      enum:
      - visitor
      - cashier
      - museum_manager
      - platform_admin
      type: string
      description: |-
        * `visitor` - Visitor
        * `cashier` - Cashier
        * `museum_manager` - Museum Manager
        * `platform_admin` - Platform Admin
    AccountUpdate:
      type: object
      description: |-
        `UserUpdateRequest` -- an account may only ever edit its own
        contact/preference fields, never role/active/email (Sec 4.3).
      properties:
        full_name:
          type: string
          maxLength: 255
        phone:
          type: string
          nullable: true
        language_preference:
          $ref: '#/components/schemas/LanguagePreferenceEnum'
    AttendanceByCategory:
      type: object
      properties:
        category:
          type: string
        bookedTotal:
          type: integer
        attendedTotal:
          type: integer
        shortfallTotal:
          type: integer
        shortfallRatePct:
          type: number
          format: double
          nullable: true
      required:
      - attendedTotal
      - bookedTotal
      - category
      - shortfallRatePct
      - shortfallTotal
    AttendanceReport:
      type: object
      description: '`GET /reports/attendance` response shape (Phase 7b).'
      properties:
        to:
          type: string
          format: date
        bookedTotal:
          type: integer
        attendedTotal:
          type: integer
        shortfallTotal:
          type: integer
        shortfallRatePct:
          type: number
          format: double
          nullable: true
        byCategory:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceByCategory'
        noShowBookingCount:
          type: integer
        noShowHeadcount:
          type: integer
        noShowRatePct:
          type: number
          format: double
          nullable: true
        correctedBookingCount:
          type: integer
        currentlyFlaggedCount:
          type: integer
        from:
          type: string
          format: date
      required:
      - attendedTotal
      - bookedTotal
      - byCategory
      - correctedBookingCount
      - currentlyFlaggedCount
      - from
      - noShowBookingCount
      - noShowHeadcount
      - noShowRatePct
      - shortfallRatePct
      - shortfallTotal
      - to
    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
          description: |-
            Only populated when the request carried `X-Client-Platform: expo`;
            a browser receives the refresh token as an httpOnly cookie instead.
        user:
          $ref: '#/components/schemas/Account'
      required:
      - access_token
      - user
    Booking:
      type: object
      description: |-
        `Booking` (Document 04). Read-only -- every mutation goes through
        the Create/Cancel/Reschedule/CategoryCorrection serializers below and
        services.py, never through this serializer directly.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        reference:
          type: string
          description: |-
            The 8-character booking reference, drawn from the alphabet
            `ABCDEFGHJKLMNPQRSTUVWXYZ23456789` (ambiguous `0/O/1/I` excluded).
            The Visitor presents it at the gate, typed or scanned.
          minLength: 8
          maxLength: 8
          pattern: '^[A-HJ-NP-Z2-9]{8}$'
          example: K7M2QP4A
          readOnly: true
        visitorId:
          type: string
          format: uuid
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/BookingItem'
          readOnly: true
        visitDate:
          type: string
          format: date
          readOnly: true
        bookingType:
          type: string
          readOnly: true
        groupName:
          type: string
          readOnly: true
          nullable: true
        groupContactPhone:
          type: string
          readOnly: true
          nullable: true
        groupTin:
          type: string
          readOnly: true
          nullable: true
        institutionId:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        visitorName:
          type: string
          readOnly: true
        visitorEmail:
          type: string
          readOnly: true
        visitorPhone:
          type: string
          readOnly: true
          nullable: true
        bookedQuantity:
          type: integer
          readOnly: true
        attendedQuantity:
          type: integer
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/BookingStatusEnum'
          readOnly: true
        rescheduledCount:
          type: integer
          readOnly: true
        categoryCorrectedAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        flaggedMismatchAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        flaggedMismatchByUserId:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        flaggedMismatchNote:
          type: string
          readOnly: true
          nullable: true
        noticeSentAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        checkoutUrl:
          type: string
          readOnly: true
          nullable: true
        receiptUrl:
          type: string
          readOnly: true
          nullable: true
        ifmisDocumentNo:
          type: string
          readOnly: true
          nullable: true
        ifmisVoucherReference:
          type: string
          readOnly: true
          nullable: true
        reconciliationId:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        totalAmountEtb:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - attendedQuantity
      - bookedQuantity
      - bookingType
      - categoryCorrectedAt
      - checkoutUrl
      - createdAt
      - flaggedMismatchAt
      - flaggedMismatchByUserId
      - flaggedMismatchNote
      - groupContactPhone
      - groupName
      - groupTin
      - id
      - ifmisDocumentNo
      - ifmisVoucherReference
      - institutionId
      - items
      - noticeSentAt
      - receiptUrl
      - reconciliationId
      - reference
      - rescheduledCount
      - status
      - totalAmountEtb
      - visitDate
      - visitorEmail
      - visitorId
      - visitorName
      - visitorPhone
    BookingCorrectionOp:
      type: object
      description: |-
        One line of a `BookingCategoryCorrectionBatchSerializer` -- same
        field shape as `BookingCategoryCorrectionSerializer` (edit) or
        `BookingItemAddSerializer` (add), disambiguated by whether `itemId` is
        given. See `services.apply_booking_corrections`'s own docstring for
        why a batch of these exists at all.
      properties:
        itemId:
          type: string
          format: uuid
          nullable: true
        categoryId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
    BookingCreate:
      type: object
      description: |-
        `BookingCreateRequest` -- FR-BOOK-001 (individual), FR-BOOK-003
        (group). A plain Serializer, not a ModelSerializer: `visitor` is
        supplied by the view from `request.user`, never from the request
        body, and `items`/`bookingType` need their own field names mapped
        onto services.create_booking's kwargs rather than a 1:1 model field
        mapping.

        `items` replaces the old single `categoryId`/`quantity` pair -- a
        booking can now mix categories (one Adult plus two Student tickets in
        the same checkout) instead of being limited to one category with a
        plain headcount. `min_length=1`: every booking still needs at least
        one category, same as before.
      properties:
        visitDate:
          type: string
          format: date
        items:
          type: array
          items:
            $ref: '#/components/schemas/BookingCreateItem'
        bookingType:
          $ref: '#/components/schemas/BookingTypeEnum'
        groupName:
          type: string
          nullable: true
        groupContactPhone:
          type: string
          nullable: true
        groupTin:
          type: string
          nullable: true
      required:
      - bookingType
      - items
      - visitDate
    BookingCreateItem:
      type: object
      description: |-
        One `{categoryId, quantity}` entry of a `BookingCreateRequest`'s
        `items` list -- see `BookingCreateSerializer` below.
      properties:
        categoryId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
      required:
      - categoryId
      - quantity
    BookingItem:
      type: object
      description: |-
        `BookingItem` (Document 04/05) -- one visitor category plus how
        many tickets of it were bought, one entry per category on a
        `Booking`. Read-only, same as `BookingSerializer` itself: line items
        are only ever created together with their parent booking (in
        `services.create_booking`) or corrected in place (`services.
        correct_booking_category`), never mutated directly through this
        serializer.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        categoryId:
          type: string
          format: uuid
          readOnly: true
        categoryNameEn:
          type: string
          readOnly: true
        categoryNameAm:
          type: string
          readOnly: true
        quantity:
          type: integer
          readOnly: true
        attendedQuantity:
          type: integer
          readOnly: true
          nullable: true
        unitPriceEtb:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        subtotalEtb:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - attendedQuantity
      - categoryId
      - categoryNameAm
      - categoryNameEn
      - id
      - quantity
      - subtotalEtb
      - unitPriceEtb
    BookingItemAdd:
      type: object
      description: |-
        `BookingItemAddRequest` -- Museum Manager only (walk-up addendum
        to the ID-verification correction flow, re-permissioned from the
        Cashier in UAT round 1). Adds a brand-new line for a
        category that isn't already on the booking -- see
        `services.add_booking_item`'s own docstring for why this is a
        separate operation from `BookingCategoryCorrectionSerializer`, which
        only ever edits an existing line.

        Both fields are required, unlike the correction serializer above: an
        added item has no existing category/quantity to leave unchanged.
      properties:
        categoryId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
      required:
      - categoryId
      - quantity
    BookingReschedule:
      type: object
      description: '`BookingRescheduleRequest` -- FR-BOOK-007.'
      properties:
        newVisitDate:
          type: string
          format: date
      required:
      - newVisitDate
    BookingStatusEnum:
      enum:
      - awaiting_payment
      - pending
      - visited
      - cancelled
      - refunded
      type: string
      description: |-
        * `awaiting_payment` - Awaiting payment
        * `pending` - Pending
        * `visited` - Visited
        * `cancelled` - Cancelled
        * `refunded` - Refunded
    BookingTimeline:
      type: object
      description: |-
        `GET /reports/booking-timeline` response shape. Mirrors
        `ReportSummarySerializer`'s `from`/`get_fields` trick above -- same
        Python-keyword problem, same fix.
      properties:
        to:
          type: string
          format: date
        days:
          type: array
          items:
            $ref: '#/components/schemas/BookingTimelineDay'
        from:
          type: string
          format: date
      required:
      - days
      - from
      - to
    BookingTimelineDay:
      type: object
      description: |-
        One day of `GET /reports/booking-timeline`'s `days` list -- see
        `services.get_booking_timeline`.
      properties:
        date:
          type: string
          format: date
        isOpenForBooking:
          type: boolean
        awaitingPaymentCount:
          type: integer
        pendingCount:
          type: integer
        visitedCount:
          type: integer
        cancelledCount:
          type: integer
        refundedCount:
          type: integer
        awaitingPaymentHeadcount:
          type: integer
        pendingHeadcount:
          type: integer
        visitedHeadcount:
          type: integer
        expectedHeadcount:
          type: integer
      required:
      - awaitingPaymentCount
      - awaitingPaymentHeadcount
      - cancelledCount
      - date
      - expectedHeadcount
      - isOpenForBooking
      - pendingCount
      - pendingHeadcount
      - refundedCount
      - visitedCount
      - visitedHeadcount
    BookingTypeEnum:
      enum:
      - individual
      - group
      type: string
      description: |-
        * `individual` - Individual
        * `group` - Group
    BookingUpdateItem:
      type: object
      description: |-
        One `{categoryId, quantity}` entry of a `BookingUpdateRequest`'s
        `items` list -- same shape as `BookingCreateItemSerializer`, kept as
        a separate class since the two requests' fields are otherwise
        unrelated (this one has no `bookingType`/group fields at all).
      properties:
        categoryId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
      required:
      - categoryId
      - quantity
    CashierBalance:
      type: object
      description: |-
        One row of `GET /reports/cashier-balances`'s `cashiers` list --
        see `services.get_cashier_balances`.
      properties:
        cashierId:
          type: string
          format: uuid
        cashierName:
          type: string
        outstandingBalanceEtb:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        unreconciledBookingCount:
          type: integer
      required:
      - cashierId
      - cashierName
      - outstandingBalanceEtb
      - unreconciledBookingCount
    CashierBalances:
      type: object
      description: |-
        `GET /reports/cashier-balances` response shape (FR-REPORT-003).
        `totalOutstandingEtb + totalReconciledEtb` is meant to be checked
        against `totalRevenueEtb` -- see `services.get_cashier_balances`'s
        docstring for what a mismatch would mean.
      properties:
        cashiers:
          type: array
          items:
            $ref: '#/components/schemas/CashierBalance'
        totalOutstandingEtb:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        totalReconciledEtb:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        totalRevenueEtb:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - cashiers
      - totalOutstandingEtb
      - totalReconciledEtb
      - totalRevenueEtb
    CashierReconciliation:
      type: object
      description: |-
        `CashierReconciliation` (per-cashier settlement transfer). Read-only
        -- every mutation goes through `services.initiate_reconciliation` /
        `confirm_reconciliation_success` / `confirm_reconciliation_failure`,
        never through this serializer directly.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        cashierId:
          type: string
          format: uuid
          readOnly: true
        amountEtb:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        chapaTransferReference:
          type: string
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/RefundStatusEnum'
          readOnly: true
        initiatedAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        completedAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        transferReceiptUrl:
          type: string
          readOnly: true
          nullable: true
        failureReason:
          type: string
          readOnly: true
          nullable: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - amountEtb
      - cashierId
      - chapaTransferReference
      - completedAt
      - createdAt
      - failureReason
      - id
      - initiatedAt
      - status
      - transferReceiptUrl
    CategoriesReport:
      type: object
      description: '`GET /reports/categories` response shape (Phase 7b).'
      properties:
        to:
          type: string
          format: date
        granularity:
          $ref: '#/components/schemas/GranularityEnum'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryReportRow'
        periodBuckets:
          type: array
          items:
            $ref: '#/components/schemas/CategoryPeriodBucket'
        from:
          type: string
          format: date
      required:
      - categories
      - from
      - granularity
      - periodBuckets
      - to
    Category:
      type: object
      description: |-
        `Category` (Document 04) -- FR-CAT-001. Read-only: every mutation
        goes through Create/Update below and services.py, never through this
        serializer directly.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name_en:
          type: string
          readOnly: true
        name_am:
          type: string
          readOnly: true
        price_etb:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        is_free:
          type: boolean
          readOnly: true
        active:
          type: boolean
          readOnly: true
      required:
      - active
      - id
      - is_free
      - name_am
      - name_en
      - price_etb
    CategoryCreate:
      type: object
      description: '`CategoryCreateRequest` -- Museum Manager only (FR-CAT-002).'
      properties:
        name_en:
          type: string
        name_am:
          type: string
        price_etb:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        is_free:
          type: boolean
      required:
      - name_am
      - name_en
      - price_etb
    CategoryPeriodBucket:
      type: object
      properties:
        bucketStart:
          type: string
          format: date
        countsByCategory:
          type: object
          additionalProperties:
            type: integer
      required:
      - bucketStart
      - countsByCategory
    CategoryReportRow:
      type: object
      properties:
        category:
          type: string
        bookedTotal:
          type: integer
        attendedTotal:
          type: integer
        revenueEtb:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        revenueSharePct:
          type: number
          format: double
          nullable: true
      required:
      - attendedTotal
      - bookedTotal
      - category
      - revenueEtb
      - revenueSharePct
    CategoryUpdate:
      type: object
      description: |-
        `CategoryUpdateRequest` -- Museum Manager only (FR-CAT-002). Every
        field is optional since a single PUT here may only be a price change,
        only a retire/reactivate (`active`), or any combination.
      properties:
        name_en:
          type: string
        name_am:
          type: string
        price_etb:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        is_free:
          type: boolean
        active:
          type: boolean
    ChapaTransferWebhook:
      type: object
      description: |-
        Chapa's Transfer (Payout) webhook payload
        (https://developer.chapa.co/integrations/webhooks -- `"type":
        "Payout"` events, e.g. `event: "payout.success"`). Only `reference`/
        `status` are validated here -- mirrors
        `apps.payments.serializers.ChapaWebhookSerializer`'s own choice to
        model just the two fields the service layer actually branches on and
        pass the rest of the payload through as-is. `reference` is the value
        *we* supplied when calling the Transfer API
        (`services.call_chapa_transfer_api` sends `str(reconciliation.id)`),
        which Chapa echoes back unchanged -- that's what
        `services.handle_chapa_transfer_webhook` looks the row up by, not
        `chapa_reference` (Chapa's own internal id for the transfer, stored
        for reference but never used as a lookup key).
      properties:
        event:
          type: string
          nullable: true
        reference:
          type: string
        status:
          type: string
          nullable: true
        chapa_reference:
          type: string
          nullable: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        currency:
          type: string
          nullable: true
      required:
      - reference
    ChapaWebhook:
      type: object
      description: |-
        `ChapaWebhookPayload` (Document 04). Only `tx_ref`/`status` are
        validated here -- Chapa's payload carries additional fields as needed
        (Document 04's `additionalProperties: true`), which `services.
        confirm_payment_from_webhook` stores as-is in `payment.webhook_payload`
        (`request.data`, not `validated_data`) rather than having every field
        modeled here.
      properties:
        tx_ref:
          type: string
        status:
          type: string
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        currency:
          type: string
          nullable: true
      required:
      - status
      - tx_ref
    CheckInResponse:
      type: object
      description: |-
        `Booking`, extended with the single `voucher` object the Cashier
        needs to key into IFMIS herself at the moment of check-in (per the
        IFMIS decision: the platform never calls IFMIS -- it only gives her
        the exact fields to copy in). Returned only from `POST
        /bookings/{id}/check-in` -- every other endpoint that returns a
        `Booking` keeps using the plain `BookingSerializer`, since this field
        is only meaningful right after a check-in action, not as a
        general-purpose booking field. Before Phase 6, this exposed five
        separate flat fields (`payerName`/`payerTin`/`amountFigures`/
        `amountWords`/`ifmisPurpose`); those are now all inside `voucher`,
        alongside the Document No/Ref No/date/public-body-name fields the
        real sample voucher turned out to need too.

        `voucher` is derived read-only from data `check_in_booking` already
        wrote (or that existed on the booking beforehand) -- nothing here
        changes `check_in_booking`'s own business logic or return value; this
        serializer only shapes its *response* representation.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        reference:
          type: string
          readOnly: true
        visitorId:
          type: string
          format: uuid
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/BookingItem'
          readOnly: true
        visitDate:
          type: string
          format: date
          readOnly: true
        bookingType:
          type: string
          readOnly: true
        groupName:
          type: string
          readOnly: true
          nullable: true
        groupContactPhone:
          type: string
          readOnly: true
          nullable: true
        groupTin:
          type: string
          readOnly: true
          nullable: true
        institutionId:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        visitorName:
          type: string
          readOnly: true
        visitorEmail:
          type: string
          readOnly: true
        visitorPhone:
          type: string
          readOnly: true
          nullable: true
        bookedQuantity:
          type: integer
          readOnly: true
        attendedQuantity:
          type: integer
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/BookingStatusEnum'
          readOnly: true
        rescheduledCount:
          type: integer
          readOnly: true
        categoryCorrectedAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        flaggedMismatchAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        flaggedMismatchByUserId:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        flaggedMismatchNote:
          type: string
          readOnly: true
          nullable: true
        noticeSentAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        checkoutUrl:
          type: string
          readOnly: true
          nullable: true
        receiptUrl:
          type: string
          readOnly: true
          nullable: true
        ifmisDocumentNo:
          type: string
          readOnly: true
          nullable: true
        ifmisVoucherReference:
          type: string
          readOnly: true
          nullable: true
        reconciliationId:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        totalAmountEtb:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        voucher:
          allOf:
          - $ref: '#/components/schemas/Voucher'
          readOnly: true
      required:
      - attendedQuantity
      - bookedQuantity
      - bookingType
      - categoryCorrectedAt
      - checkoutUrl
      - createdAt
      - flaggedMismatchAt
      - flaggedMismatchByUserId
      - flaggedMismatchNote
      - groupContactPhone
      - groupName
      - groupTin
      - id
      - ifmisDocumentNo
      - ifmisVoucherReference
      - institutionId
      - items
      - noticeSentAt
      - receiptUrl
      - reconciliationId
      - reference
      - rescheduledCount
      - status
      - totalAmountEtb
      - visitDate
      - visitorEmail
      - visitorId
      - visitorName
      - visitorPhone
      - voucher
