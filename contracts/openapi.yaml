openapi: 3.0.3
info:
  title: Museum Ticketing & Booking Platform API
  version: 0.2.0
  description: Bilingual (EN/AM) online booking, payment, and gate check-in for the
    Zoological Natural History Museum's digital ticketing track.
paths:
  /api/v1/admin/staff/:
    get:
      operationId: v1_admin_staff_list
      description: |-
        `GET /admin/staff` and `POST /admin/staff` -- both Platform Admin
        only (FR-ACC-002).
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccountList'
          description: ''
    post:
      operationId: v1_admin_staff_create
      description: |-
        `GET /admin/staff` and `POST /admin/staff` -- both Platform Admin
        only (FR-ACC-002).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StaffCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffCreate'
        required: true
      security:
      - TokenVersionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
  /api/v1/admin/staff/{id}/:
    put:
      operationId: v1_admin_staff_update
      description: |-
        `PUT /admin/staff/{id}` and `DELETE /admin/staff/{id}` -- both
        Platform Admin only (FR-ACC-002). No `GET` here: Document 04 has no
        single-staff-account retrieve endpoint, only the list at
        `/admin/staff` (mirrors `apps.catalog.CategoryDetailView`).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StaffUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffUpdate'
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
    delete:
      operationId: v1_admin_staff_destroy
      description: |-
        `PUT /admin/staff/{id}` and `DELETE /admin/staff/{id}` -- both
        Platform Admin only (FR-ACC-002). No `GET` here: Document 04 has no
        single-staff-account retrieve endpoint, only the list at
        `/admin/staff` (mirrors `apps.catalog.CategoryDetailView`).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/forgot-password/:
    post:
      operationId: v1_auth_forgot_password_create
      description: |-
        POST /auth/forgot-password -- Staff only (FR-ACC-006). Always 200;
        see services.request_password_reset for why.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ForgotPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ForgotPassword'
        required: true
      security:
      - TokenVersionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: POST /auth/login -- Staff only (FR-ACC-002, FR-ACC-005).
      parameters:
      - $ref: '#/components/parameters/XClientPlatform'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StaffLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffLogin'
        required: true
      security:
      - TokenVersionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                StaffLogin(mock):
                  value:
                    access_token: mock-access-token
                    user:
                      id: 00000000-0000-0000-0000-000000000001
                      email: manager@znhm.et
                      phone: null
                      full_name: Mock Museum Manager
                      role: museum_manager
                      language_preference: en
                      active: true
                      created_at: '2026-01-01T00:00:00Z'
                  summary: Staff login (mock)
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: |-
        POST /auth/logout -- clears the refresh-token cookie so the browser
        stops presenting it. Note: this does not blacklist the token
        server-side -- SIMPLE_JWT.BLACKLIST_AFTER_ROTATION=True already assumes
        that, but `rest_framework_simplejwt.token_blacklist` isn't in
        INSTALLED_APPS (config/settings/base.py), so today every rotation's
        `refresh.blacklist()` call is silently swallowed (simplejwt only
        defines that method when the app is installed, and the rotation code
        catches the resulting AttributeError). Worth installing + migrating
        that app separately so old refresh tokens are actually invalidated,
        not just no-longer-cookied on this device.
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      description: |-
        POST /auth/refresh/ -- mounted at the root urlconf (config/urls.py),
        shared by both credential paths (Sec 4.1).

        A browser reads the refresh token from the httpOnly cookie set by
        `_auth_response` and re-sets the cookie with the rotated token on
        success, per SIMPLE_JWT's ROTATE_REFRESH_TOKENS. A native client that
        declares itself with `X-Client-Platform: expo` has no cookie jar and
        instead sends the refresh token in the request body and receives the
        rotated one in the response body.
      parameters:
      - $ref: '#/components/parameters/XClientPlatform'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: "Only used by a non-cookie client (`X-Client-Platform: expo`)."
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/v1/auth/reset-password/:
    post:
      operationId: v1_auth_reset_password_create
      description: POST /auth/reset-password -- Staff only (FR-ACC-006).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResetPassword'
        required: true
      security:
      - TokenVersionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/v1/auth/visitor/verify/confirm/:
    post:
      operationId: v1_auth_visitor_verify_confirm_create
      description: |-
        POST /auth/visitor/verify/confirm -- completes Visitor verification
        and issues the same token pair Staff login does (Sec 4.1).
      parameters:
      - $ref: '#/components/parameters/XClientPlatform'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitorVerifyConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VisitorVerifyConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VisitorVerifyConfirm'
        required: true
      security:
      - TokenVersionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/visitor/verify/email/{token}/:
    get:
      operationId: v1_auth_visitor_verify_email_retrieve
      description: |-
        GET /auth/visitor/verify/email/{token} -- the secondary/fallback
        verification channel (Sec 4.1 step 2). Opening this link marks
        `email_verified_at` but never issues a session on its own; only the
        OTP path above does that.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/v1/auth/visitor/verify/start/:
    post:
      operationId: v1_auth_visitor_verify_start_create
      description: |-
        POST /auth/visitor/verify/start (FR-ACC-001, FR-ACC-003, FR-ACC-004).
        Used for both a first-time booking and a returning Visitor looking up
        their history -- there is no separate "login" for a Visitor.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitorVerifyStart'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VisitorVerifyStart'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VisitorVerifyStart'
        required: true
      security:
      - TokenVersionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorVerifyStartResponse'
          description: ''
  /api/v1/availability/:
    get:
      operationId: v1_availability_list
      description: GET /availability -- public (FR-BOOK-008).
      parameters:
      - name: from
        required: true
        in: query
        description: First date of the range (inclusive), `YYYY-MM-DD`.
        schema:
          type: string
          format: date
      - name: to
        required: true
        in: query
        description: Last date of the range (inclusive), `YYYY-MM-DD`.
        schema:
          type: string
          format: date
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DateAvailability'
          description: ''
  /api/v1/availability/{date}/:
    put:
      operationId: v1_availability_update
      description: PUT /availability/{date} -- Museum Manager only (FR-BOOK-008).
      parameters:
      - in: path
        name: date
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DateAvailabilityUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DateAvailabilityUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DateAvailabilityUpdate'
        required: true
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DateAvailability'
          description: ''
  /api/v1/bookings/:
    get:
      operationId: listBookings
      description: |-
        GET /bookings (Staff only) and POST /bookings (Visitor only,
        FR-BOOK-001/FR-BOOK-003).
      parameters:
      - name: status
        required: false
        in: query
        schema:
          $ref: '#/components/schemas/BookingStatusEnum'
      - name: visitDate
        required: false
        in: query
        schema:
          type: string
          format: date
      - name: bookingType
        required: false
        in: query
        schema:
          type: string
          enum: [individual, group]
      - name: flagged
        required: false
        in: query
        schema:
          type: boolean
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
    post:
      operationId: createBooking
      description: |-
        GET /bookings (Staff only) and POST /bookings (Visitor only,
        FR-BOOK-001/FR-BOOK-003).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingCreate'
        required: true
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/bookings/{id}/:
    get:
      operationId: getBooking
      description: |-
        GET /bookings/{id} -- the owning Visitor or any Staff member.

        Also handles PATCH /bookings/{id} -- the owning Visitor only, editing
        their own booking's ticket mix and/or visit date while it's still
        `AwaitingPayment` (see `BookingUpdateSerializer`/`services.
        update_awaiting_payment_booking`). Kept on the same resource/URL as
        the GET above rather than a separate endpoint, since it's the same
        `Booking` -- just a different HTTP method and a narrower audience.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
    patch:
      operationId: updateBooking
      description: |-
        GET /bookings/{id} -- the owning Visitor or any Staff member.

        Also handles PATCH /bookings/{id} -- the owning Visitor only, editing
        their own booking's ticket mix and/or visit date while it's still
        `AwaitingPayment` (see `BookingUpdateSerializer`/`services.
        update_awaiting_payment_booking`). Kept on the same resource/URL as
        the GET above rather than a separate endpoint, since it's the same
        `Booking` -- just a different HTTP method and a narrower audience.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBookingUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBookingUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBookingUpdate'
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/bookings/{id}/cancel/:
    post:
      operationId: v1_bookings_cancel_create
      description: |-
        POST /bookings/{id}/cancel -- FR-BOOK-005/006 for a `Pending`
        (i.e. already paid) booking.

        Also reachable against a still-unpaid `AwaitingPayment` booking, as
        the delete half of the Visitor's own pre-payment editing capability
        alongside `BookingDetailView.patch` above -- deliberately the same
        endpoint rather than a separate one, since "cancel" is the right verb
        either way; only the consequence (refund, or not) differs.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/bookings/{id}/category-correction/:
    patch:
      operationId: v1_bookings_category_correction_partial_update
      description: |-
        PATCH /bookings/{id}/category-correction -- Museum Manager (or
        Platform Admin) only (ID-verification addendum to Document 02 Sec
        2.2; re-permissioned from the Cashier in UAT round 1 -- see
        `services.correct_booking_category`'s own docstring for the policy
        change).

        Corrects a booking item's category and/or quantity -- category, when
        the visitor's ID at the gate doesn't match what they booked under;
        quantity, when the actual headcount for that item doesn't match what
        was booked (either direction) -- then either reopens payment for the
        difference (undercharge) or issues a refund for the difference
        (overcharge). Reached from the Manager's flagged-booking queue
        (`GET /bookings?flagged=true`) or on her own initiative. Lives here,
        not in `apps.entrance` -- even though it's a gate-side action --
        because this is where that composition with `apps.payments`/
        `apps.refunds` already happens (`BookingListCreateView.post`/
        `BookingCancelView` above); `entrance` depends on `bookings` only,
        with no dependency of its own on `refunds`/`payments`
        (`apps.entrance.services`' own module docstring), so putting this
        endpoint there would violate that boundary. See
        `services.correct_booking_category`'s own docstring for the full
        rationale.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBookingCategoryCorrection'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBookingCategoryCorrection'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBookingCategoryCorrection'
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/bookings/{id}/category-corrections/batch/:
    patch:
      operationId: v1_bookings_category_corrections_batch_partial_update
      description: |-
        PATCH /bookings/{id}/category-corrections/batch -- Museum Manager
        (or Platform Admin) only (ID-verification addendum, batch extension;
        re-permissioned from the Cashier in UAT round 1).

        Batch sibling of `BookingCategoryCorrectionView`/`BookingItemAddView`
        above: accepts a list of the same per-item edit/add shapes those two
        single-item endpoints take, and applies the whole list as one atomic
        correction with a single combined delta. This is what actually fixes
        the gate-workflow gap those two single-item endpoints have -- a
        Manager who needs to bump two categories' headcounts in the same
        visit (both undercharges) previously couldn't, because the first
        single-item PATCH flips the booking out of `Pending` and the second
        then 409s. See `services.apply_booking_corrections`'s own docstring
        for the full rationale, including how it orders category-moves within
        the batch and rejects an unresolvable two-way swap.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBookingCategoryCorrectionBatch'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBookingCategoryCorrectionBatch'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBookingCategoryCorrectionBatch'
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/bookings/{id}/check-in/:
    post:
      operationId: checkInBooking
      description: |-
        POST /bookings/{id}/check-in -- Cashier only
        (FR-TICKET-001 - FR-TICKET-003, FR-TICKET-005).

        Takes no request body (UAT round 1): the Cashier no longer supplies a
        per-item attended count here -- see `services.check_in_booking`'s own
        docstring for why a mismatch can no longer reach this call at all.
        409s if the booking is not `Pending`, or if it has an open mismatch
        flag (`FlagMismatchView` below) still awaiting a Manager correction.

        Returns `CheckInResponseSerializer`, not the plain `BookingSerializer`
        -- the IFMIS-decision build prompt's Step 7: the response carries the
        extra fields the Cashier needs to key this transaction into IFMIS
        herself (payer name, amount in figures/words, purpose string).
        `services.check_in_booking`'s own business logic and return value
        (the `Booking` instance) are unchanged; only how the response is
        *serialized* differs from every other endpoint that returns a
        `Booking`.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInResponse'
          description: ''
  /api/v1/bookings/{id}/flag-mismatch/:
    post:
      operationId: flagBookingMismatch
      description: |-
        POST /bookings/{id}/flag-mismatch/ -- Cashier only (UAT round 1,
        Document 02 Sec 2.5's policy update).

        The other branch of the gate-side check-in decision, alongside
        `CheckInView` above: called instead of check-in when the party at the
        gate doesn't match what's booked. Puts the booking on the Museum
        Manager's flagged-booking queue (`GET /bookings?flagged=true`) for
        her to correct -- see `services.flag_booking_mismatch`'s own
        docstring for why this never touches a quantity/category field
        itself. 409s if the booking is not `Pending`.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagMismatchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FlagMismatchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FlagMismatchRequest'
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/bookings/{id}/ifmis-voucher/:
    get:
      operationId: getIfmisVoucher
      description: |-
        /bookings/{id}/ifmis-voucher/ -- Cashier only.

        GET re-opens the voucher panel (Phase 6 Step 6) for a Cashier who
        navigated away before recording the Document No/Ref No -- the exact
        same `voucher` shape `CheckInResponseSerializer` returns right after
        check-in, computed by the same `services.compute_voucher`, so the
        panel looks identical whichever way it was reached. Available on any
        checked-in booking (not restricted to the checking-in Cashier --
        unlike the write below, simply viewing the voucher again isn't the
        sensitive half of this).

        PATCH is restricted to the same Cashier who checked this booking in
        (services.py enforces this, not this permission class -- it needs
        the specific booking, not just the role). Called after she's
        actually entered the transaction into IFMIS and gotten the real
        Document No *and* Ref No back; settable once, both together
        (Section 8's default).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Voucher'
          description: ''
    patch:
      operationId: recordIfmisVoucher
      description: |-
        /bookings/{id}/ifmis-voucher/ -- Cashier only.

        GET re-opens the voucher panel (Phase 6 Step 6) for a Cashier who
        navigated away before recording the Document No/Ref No -- the exact
        same `voucher` shape `CheckInResponseSerializer` returns right after
        check-in, computed by the same `services.compute_voucher`, so the
        panel looks identical whichever way it was reached. Available on any
        checked-in booking (not restricted to the checking-in Cashier --
        unlike the write below, simply viewing the voucher again isn't the
        sensitive half of this).

        PATCH is restricted to the same Cashier who checked this booking in
        (services.py enforces this, not this permission class -- it needs
        the specific booking, not just the role). Called after she's
        actually entered the transaction into IFMIS and gotten the real
        Document No *and* Ref No back; settable once, both together
        (Section 8's default).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedIfmisVoucherUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedIfmisVoucherUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedIfmisVoucherUpdate'
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/bookings/{id}/items/:
    post:
      operationId: v1_bookings_items_create
      description: |-
        POST /bookings/{id}/items -- Museum Manager (or Platform Admin)
        only (walk-up addendum to the ID-verification correction flow;
        re-permissioned from the Cashier in UAT round 1).

        Adds a brand-new line for a category that wasn't on the booking at
        all -- e.g. a group booked as 3 Students shows up with 2 Adults never
        part of the original booking -- then reopens payment for the new
        item's full price. See `services.add_booking_item`'s own docstring
        for why this is a distinct operation from
        `BookingCategoryCorrectionView`, which only ever edits an existing
        line. Lives here for the same `apps.payments` composition/module-
        boundary reasons as `BookingCategoryCorrectionView` above.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingItemAdd'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingItemAdd'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingItemAdd'
        required: true
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/bookings/{id}/receipt/download/:
    get:
      operationId: v1_bookings_receipt_download_retrieve
      description: |-
        GET /bookings/{id}/receipt/download/ -- the owning Visitor or any
        Staff member (same access rule as BookingDetailView).

        `booking.receipt_url` (exposed as `receiptUrl` on BookingSerializer)
        is a direct link straight to storage, used to *view* the PDF in a
        new tab. It isn't a reliable target for a forced download initiated
        from frontend JS: browser navigation to it works fine, but a
        scripted `fetch()` of it can be blocked by CORS (storage is served
        by the reverse proxy/object storage in staging/production, not this
        Django app -- see config/urls.py) or by mixed-content restrictions
        if that storage host isn't on HTTPS. Streaming the same bytes back
        through this API host instead -- which the frontend already talks
        to successfully for everything else -- sidesteps both, and
        `as_attachment=True` makes the browser save it regardless of how
        the response is loaded.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          description: No response body
