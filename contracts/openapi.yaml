          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - bucketStart
      - grossEtb
      - netEtb
      - refundsEtb
    RevenueReport:
      type: object
      description: '`GET /reports/revenue` response shape (Phase 7b).'
      properties:
        to:
          type: string
          format: date
        granularity:
          $ref: '#/components/schemas/GranularityEnum'
        grossEtb:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        refundsEtb:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        netEtb:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        revenueByCategory:
          type: object
          additionalProperties:
            type: string
            format: decimal
            pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        individualEtb:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        institutionalEtb:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        periodBuckets:
          type: array
          items:
            $ref: '#/components/schemas/RevenuePeriodBucket'
        from:
          type: string
          format: date
      required:
      - from
      - granularity
      - grossEtb
      - individualEtb
      - institutionalEtb
      - netEtb
      - periodBuckets
      - refundsEtb
      - revenueByCategory
      - to
    StaffCreate:
      type: object
      description: |-
        `StaffCreateRequest` (Document 04) -- FR-ACC-002, Platform Admin
        only. No `password` field: services.create_staff_account provisions
        the account with no usable password and sends a set-password link
        instead (FR-ACC-006's flow, reused).
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
          default: ''
          maxLength: 32
        full_name:
          type: string
          maxLength: 255
        role:
          $ref: '#/components/schemas/StaffRoleEnum'
      required:
      - email
      - full_name
      - role
    StaffLogin:
      type: object
      description: '`LoginRequest` -- Staff only (FR-ACC-002, FR-ACC-005).'
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    StaffRoleEnum:
      enum:
      - cashier
      - museum_manager
      type: string
      description: |-
        * `cashier` - Cashier
        * `museum_manager` - Museum Manager
    StaffUpdate:
      type: object
      description: |-
        `StaffUpdateRequest` (Document 04) -- FR-ACC-002, Platform Admin
        only. Every field optional so a single `PUT` can update the staff
        profile and role without changing the password.
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
          maxLength: 32
        full_name:
          type: string
          maxLength: 255
        role:
          $ref: '#/components/schemas/StaffRoleEnum'
        active:
          type: boolean
    StatusMix:
      type: object
      properties:
        pending:
          type: integer
        visited:
          type: integer
        cancelled:
          type: integer
        refunded:
          type: integer
      required:
      - cancelled
      - pending
      - refunded
      - visited
    TokenRefreshResponse:
      type: object
      properties:
        access:
          type: string
        refresh_token:
          type: string
          description: |-
            Only populated when the request carried `X-Client-Platform: expo`;
            a browser receives the rotated refresh token as an httpOnly cookie instead.
      required:
      - access
    VisitorVerifyConfirm:
      type: object
      description: '`VisitorVerifyConfirmRequest`.'
      properties:
        verification_id:
          type: string
          format: uuid
        otp_code:
          type: string
          maxLength: 6
          minLength: 6
      required:
      - otp_code
      - verification_id
    VisitorVerifyStart:
      type: object
      description: |-
        `VisitorVerifyStartRequest` (Document 04) -- FR-ACC-001, FR-ACC-003.
        No password field exists here or anywhere in the Visitor path.
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
          maxLength: 32
        full_name:
          type: string
          default: ''
          maxLength: 255
        language_preference:
          $ref: '#/components/schemas/LanguagePreferenceEnum'
      required:
      - email
      - phone
    VisitorVerifyStartResponse:
      type: object
      properties:
        verification_id:
          type: string
          format: uuid
        otp_expires_in_seconds:
          type: integer
      required:
      - otp_expires_in_seconds
      - verification_id
    Voucher:
      type: object
      description: |-
        The `voucher` object (Phase 6, UAT round 1): every field the
        Cashier needs to key into IFMIS, laid out in the same top-to-bottom
        order as the real printed voucher, computed entirely by
        `services.compute_voucher` -- this serializer only shapes the field
        names/types of what that function already returns, matching it key
        for key (a plain dict, no `source=` remapping needed). Shared,
        unmodified, by both `CheckInResponseSerializer` below (right after
        check-in) and `GET /bookings/{id}/ifmis-voucher/` (re-opening the
        panel later) -- one shape, one place it's computed, so the two
        callers can never drift apart.

        `documentNo`/`refNo` are null until `record_ifmis_voucher` sets them;
        `voucherRecorded` is true only once *both* are set (Section 8's "both
        required together" default) and is what should drive a "voucher
        pending" badge, rather than the frontend checking either field
        individually.
      properties:
        documentNo:
          type: string
          nullable: true
        date:
          type: string
          nullable: true
        refNo:
          type: string
          nullable: true
        nameOfPublicBody:
          type: string
        receivedFrom:
          type: string
        amountFigures:
          type: string
        amountWords:
          type: string
        purpose:
          type: string
        voucherRecorded:
          type: boolean
      required:
      - amountFigures
      - amountWords
      - date
      - documentNo
      - nameOfPublicBody
      - purpose
      - receivedFrom
      - refNo
      - voucherRecorded
    AuditLogEntry:
      type: object
      readOnly: true
      description: One append-only entry of the platform audit trail (FR-AUDIT-001).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actorUserId:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: Null for system-initiated actions.
        action:
          type: string
          readOnly: true
          example: booking.cancelled
        entityType:
          type: string
          readOnly: true
        entityId:
          type: string
          format: uuid
          readOnly: true
        metadata:
          type: object
          additionalProperties: true
          readOnly: true
          nullable: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - createdAt
      - entityId
      - entityType
      - id
    NotificationPreference:
      type: object
      description: The caller's notification channels and language (FR-NOTIFY-PREF-001).
      properties:
        emailEnabled:
          type: boolean
        smsEnabled:
          type: boolean
        pushEnabled:
          type: boolean
        language:
          $ref: '#/components/schemas/LanguagePreferenceEnum'
      required:
      - emailEnabled
      - language
      - pushEnabled
      - smsEnabled
    DeviceToken:
      type: object
      description: A registered push destination for an account (FR-NOTIFY-PUSH-001).
      properties:
        token:
          type: string
        platform:
          type: string
          enum:
          - ios
          - android
        active:
          type: boolean
          readOnly: true
        lastSeenAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - platform
      - token
  securitySchemes:
    TokenVersionAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
