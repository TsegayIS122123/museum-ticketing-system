openapi: 3.0.3
info:
  title: Museum Ticketing & Booking Platform API
  version: 1.0.0
  description: Bilingual (EN/AM) online booking, payment, and gate check-in for the
    Science Museum's digital ticketing track.
paths:
  /api/v1/admin/staff/:
    get:
      operationId: v1_admin_staff_list
      description: |-
        `GET /admin/staff` and `POST /admin/staff` -- both Platform Admin
        only (FR-ACC-002).
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccountList'
          description: ''
    post:
      operationId: v1_admin_staff_create
      description: |-
        `GET /admin/staff` and `POST /admin/staff` -- both Platform Admin
        only (FR-ACC-002).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StaffCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffCreate'
        required: true
      security:
      - TokenVersionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
  /api/v1/admin/staff/{id}/:
    put:
      operationId: v1_admin_staff_update
      description: |-
        `PUT /admin/staff/{id}` and `DELETE /admin/staff/{id}` -- both
        Platform Admin only (FR-ACC-002). No `GET` here: Document 04 has no
        single-staff-account retrieve endpoint, only the list at
        `/admin/staff` (mirrors `apps.catalog.CategoryDetailView`).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StaffUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffUpdate'
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
    delete:
      operationId: v1_admin_staff_destroy
      description: |-
        `PUT /admin/staff/{id}` and `DELETE /admin/staff/{id}` -- both
        Platform Admin only (FR-ACC-002). No `GET` here: Document 04 has no
        single-staff-account retrieve endpoint, only the list at
        `/admin/staff` (mirrors `apps.catalog.CategoryDetailView`).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/forgot-password/:
    post:
      operationId: v1_auth_forgot_password_create
      description: |-
        POST /auth/forgot-password -- Staff only (FR-ACC-006). Always 200;
        see services.request_password_reset for why.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ForgotPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ForgotPassword'
        required: true
      security:
      - TokenVersionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: POST /auth/login -- Staff only (FR-ACC-002, FR-ACC-005).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StaffLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffLogin'
        required: true
      security:
      - TokenVersionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                StaffLogin(mock):
                  value:
                    access_token: mock-access-token
                    user:
                      id: 00000000-0000-0000-0000-000000000001
                      email: manager@sciencemuseum.et
                      phone: null
                      full_name: Mock Museum Manager
                      role: museum_manager
                      language_preference: en
                      active: true
                      created_at: '2026-01-01T00:00:00Z'
                  summary: Staff login (mock)
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: |-
        POST /auth/logout -- clears the refresh-token cookie so the browser
        stops presenting it. Note: this does not blacklist the token
        server-side -- SIMPLE_JWT.BLACKLIST_AFTER_ROTATION=True already assumes
        that, but `rest_framework_simplejwt.token_blacklist` isn't in
        INSTALLED_APPS (config/settings/base.py), so today every rotation's
        `refresh.blacklist()` call is silently swallowed (simplejwt only
        defines that method when the app is installed, and the rotation code
        catches the resulting AttributeError). Worth installing + migrating
        that app separately so old refresh tokens are actually invalidated,
        not just no-longer-cookied on this device.
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      description: |-
        POST /auth/refresh/ -- mounted at the root urlconf (config/urls.py),
        shared by both credential paths (Sec 4.1).

        Reads the refresh token from the httpOnly cookie set by `_auth_response`
        above instead of requiring it in the request body -- the frontend never
        holds or sends the refresh token itself (cookies.py). Re-sets the
        cookie with the rotated token on success, per SIMPLE_JWT's
        ROTATE_REFRESH_TOKENS.
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/v1/auth/reset-password/:
    post:
      operationId: v1_auth_reset_password_create
      description: POST /auth/reset-password -- Staff only (FR-ACC-006).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResetPassword'
        required: true
      security:
      - TokenVersionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/v1/auth/visitor/verify/confirm/:
    post:
      operationId: v1_auth_visitor_verify_confirm_create
      description: |-
        POST /auth/visitor/verify/confirm -- completes Visitor verification
        and issues the same token pair Staff login does (Sec 4.1).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitorVerifyConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VisitorVerifyConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VisitorVerifyConfirm'
        required: true
      security:
      - TokenVersionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/visitor/verify/email/{token}/:
    get:
      operationId: v1_auth_visitor_verify_email_retrieve
      description: |-
        GET /auth/visitor/verify/email/{token} -- the secondary/fallback
        verification channel (Sec 4.1 step 2). Opening this link marks
        `email_verified_at` but never issues a session on its own; only the
        OTP path above does that.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/v1/auth/visitor/verify/start/:
    post:
      operationId: v1_auth_visitor_verify_start_create
      description: |-
        POST /auth/visitor/verify/start (FR-ACC-001, FR-ACC-003, FR-ACC-004).
        Used for both a first-time booking and a returning Visitor looking up
        their history -- there is no separate "login" for a Visitor.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitorVerifyStart'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VisitorVerifyStart'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VisitorVerifyStart'
        required: true
      security:
      - TokenVersionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorVerifyStartResponse'
          description: ''
  /api/v1/availability/:
    get:
      operationId: v1_availability_list
      description: GET /availability -- public (FR-BOOK-008).
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DateAvailability'
          description: ''
  /api/v1/availability/{date}/:
    put:
      operationId: v1_availability_update
      description: PUT /availability/{date} -- Museum Manager only (FR-BOOK-008).
      parameters:
      - in: path
        name: date
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DateAvailabilityUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DateAvailabilityUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DateAvailabilityUpdate'
        required: true
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DateAvailability'
          description: ''
  /api/v1/bookings/:
    get:
      operationId: listBookings
      description: |-
        GET /bookings (Staff only) and POST /bookings (Visitor only,
        FR-BOOK-001/FR-BOOK-003).
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
    post:
      operationId: createBooking
      description: |-
        GET /bookings (Staff only) and POST /bookings (Visitor only,
        FR-BOOK-001/FR-BOOK-003).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingCreate'
        required: true
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/bookings/{id}/:
    get:
      operationId: getBooking
      description: GET /bookings/{id} -- the owning Visitor or any Staff member.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/bookings/{id}/approval/:
    put:
      operationId: v1_bookings_approval_update
      description: PUT /bookings/{id}/approval -- Museum Manager only (FR-BOOK-003).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingApproval'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingApproval'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingApproval'
        required: true
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/bookings/{id}/cancel/:
    post:
      operationId: v1_bookings_cancel_create
      description: POST /bookings/{id}/cancel -- FR-BOOK-005/006.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/bookings/{id}/check-in/:
    post:
      operationId: checkInBooking
      description: |-
        POST /bookings/{id}/check-in -- Cashier only
        (FR-TICKET-001 - FR-TICKET-003, FR-TICKET-005).

        Returns `CheckInResponseSerializer`, not the plain `BookingSerializer`
        -- the IFMIS-decision build prompt's Step 7: the response carries the
        extra fields the Cashier needs to key this transaction into IFMIS
        herself (payer name, amount in figures/words, purpose string).
        `services.check_in_booking`'s own business logic and return value
        (the `Booking` instance) are unchanged; only how the response is
        *serialized* differs from every other endpoint that returns a
        `Booking`.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CheckInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CheckInRequest'
        required: true
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInResponse'
          description: ''
  /api/v1/bookings/{id}/ifmis-voucher/:
    patch:
      operationId: recordIfmisVoucherReference
      description: |-
        PATCH /bookings/{id}/ifmis-voucher/ -- Cashier only, and only the
        same Cashier who checked this booking in (services.py enforces this,
        not this permission class -- it needs the specific booking, not just
        the role). Called after she's actually entered the transaction into
        IFMIS and gotten the real voucher reference back; settable once.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedIfmisVoucherUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedIfmisVoucherUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedIfmisVoucherUpdate'
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/bookings/{id}/refund-requests/:
    post:
      operationId: requestPartialRefund
      description: |-
        POST /bookings/{id}/refund-requests -- Visitor only
        (FR-TICKET-002, FR-REFUND-001b). Mounted under the top-level
        `/bookings/{id}/` path (see `apps.refunds.urls`'s
        `refund_request_urlpatterns`), even though `refunds` owns the
        business logic behind it -- mirrors how `apps.entrance`'s
        Cashier-facing endpoints live at `/bookings/...` despite that app
        owning FR-TICKET, not `apps.bookings`.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequestCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefundRequestCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefundRequestCreate'
      security:
      - TokenVersionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
          description: ''
  /api/v1/bookings/{id}/reschedule/:
    post:
      operationId: v1_bookings_reschedule_create
      description: POST /bookings/{id}/reschedule -- FR-BOOK-007.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingReschedule'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingReschedule'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingReschedule'
        required: true
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/bookings/lookup/:
    get:
      operationId: lookupBookingByReference
      description: |-
        GET /bookings/lookup -- Cashier only (FR-TICKET-001, FR-TICKET-004).

        Mounted under /api/v1/ (config/urls.py), not /api/v1/entrance/, since
        Document 04 places this at `/bookings/lookup` -- the entrance module
        owns the business logic (Design Spec Sec 3.2) without owning that
        part of the URL namespace, mirroring how `bookings` owns
        `/availability` despite that also not living under its own prefix.
      parameters:
      - in: query
        name: reference
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/categories/:
    get:
      operationId: v1_categories_list
      description: |-
        GET /categories (FR-CAT-001, public, no auth) and POST /categories
        (FR-CAT-002, Museum Manager only).

        GET also accepts `?active=all` -- Museum Manager only (silently
        ignored for anyone else, rather than erroring, so a stale link
        doesn't break for a Visitor) -- to include retired categories, so a
        Manager can find one again to reactivate it. Default behavior
        (active-only, cached) is unchanged for every other caller.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryList'
          description: ''
    post:
      operationId: v1_categories_create
      description: |-
        GET /categories (FR-CAT-001, public, no auth) and POST /categories
        (FR-CAT-002, Museum Manager only).

        GET also accepts `?active=all` -- Museum Manager only (silently
        ignored for anyone else, rather than erroring, so a stale link
        doesn't break for a Visitor) -- to include retired categories, so a
        Manager can find one again to reactivate it. Default behavior
        (active-only, cached) is unchanged for every other caller.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
        required: true
      security:
      - TokenVersionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryCreate'
          description: ''
  /api/v1/categories/{id}/:
    put:
      operationId: v1_categories_update
      description: |-
        PUT /categories/{id} and DELETE /categories/{id} -- both Museum
        Manager only (FR-CAT-002). No GET here: Document 04 has no single-
        category retrieve endpoint, only the list at /categories.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    delete:
      operationId: v1_categories_destroy
      description: |-
        PUT /categories/{id} and DELETE /categories/{id} -- both Museum
        Manager only (FR-CAT-002). No GET here: Document 04 has no single-
        category retrieve endpoint, only the list at /categories.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/payments/webhooks/chapa/:
    post:
      operationId: handleChapaWebhook
      description: |-
        POST /payments/webhooks/chapa/ -- AllowAny + signature check
        (Design Spec Sec 4.2; NFR-SEC-001). The only path that confirms a
        booking (FR-PAY-002) -- never the client-side `return_url` redirect.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChapaWebhook'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChapaWebhook'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChapaWebhook'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
        '400':
          description: No response body
        '401':
          description: No response body
  /api/v1/refunds/:
    get:
      operationId: listRefunds
      description: |-
        GET /refunds -- any authenticated user (Visitors see only their
        own; Staff can filter across all, Document 04).
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRefundList'
          description: ''
  /api/v1/reports/dashboard/:
    get:
      operationId: getDashboard
      description: |-
        GET /reports/dashboard -- Museum Manager/Platform Admin only
        (FR-REPORT-001).
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
          description: ''
  /api/v1/reports/summary/:
    get:
      operationId: getReportSummary
      description: |-
        GET /reports/summary -- Museum Manager/Platform Admin only
        (FR-REPORT-002).
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSummary'
          description: ''
  /api/v1/settlement/my-balance/:
    get:
      operationId: getMyOutstandingBalance
      description: |-
        GET /settlement/my-balance/ -- Cashier only. Her own outstanding
        balance (unreconciled Visited bookings minus unreconciled completed
        refunds) -- never a platform-wide total (IFMIS decision).
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutstandingBalance'
          description: ''
  /api/v1/settlement/reconcile/:
    post:
      operationId: initiateReconciliation
      description: |-
        POST /settlement/reconcile/ -- Cashier only. The one-click action:
        locks her outstanding bookings/refunds, creates a `PENDING`
        reconciliation row, and calls Chapa's Transfer API to move her
        balance into the university's fixed bank account. A confirm dialog on
        the client is sufficient before calling this (no OTP step -- already
        decided); this endpoint itself performs no additional confirmation.
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashierReconciliation'
          description: ''
  /api/v1/settlement/reconciliations/:
    get:
      operationId: listReconciliations
      description: |-
        GET /settlement/reconciliations/ -- any authenticated Staff member.
        A Cashier sees only her own attempts; Museum Manager/Platform Admin
        see every cashier's (mirrors `apps.refunds.views.RefundListView`'s own
        ownership-scoping pattern).
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCashierReconciliationList'
          description: ''
  /api/v1/settlement/webhook/chapa-transfer/:
    post:
      operationId: handleChapaTransferWebhook
      description: |-
        POST /settlement/webhook/chapa-transfer/ -- AllowAny + signature
        check (mirrors `apps.payments.views.ChapaWebhookView` exactly, same
        HMAC-SHA256-over-the-raw-body verification against
        `CHAPA_WEBHOOK_SECRET`). The only path that ever moves a
        reconciliation out of `PENDING` -- there is no client-side redirect
        for a bank transfer to (incorrectly) trust instead.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChapaTransferWebhook'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChapaTransferWebhook'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChapaTransferWebhook'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
        '400':
          description: No response body
        '401':
          description: No response body
  /api/v1/users/me/:
    get:
      operationId: v1_users_me_retrieve
      description: |-
        GET/PUT /users/me -- Visitor and Staff share this endpoint; there is
        no scoped RBAC to check beyond "is this account authenticated" (Sec 4.3).
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
    put:
      operationId: v1_users_me_update
      description: |-
        GET/PUT /users/me -- Visitor and Staff share this endpoint; there is
        no scoped RBAC to check beyond "is this account authenticated" (Sec 4.3).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
  /api/v1/users/me/bookings/:
    get:
      operationId: listMyBookings
      description: |-
        GET /users/me/bookings -- FR-ACC-004. Mounted at the root URLconf
        (config/urls.py), not here, mirroring CurrentUserView's placement --
        Document 04 puts this under `/users/`, not `/bookings/`.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingList'
          description: ''
components:
  schemas:
    Account:
      type: object
      description: |-
        `UserProfile` (Document 04) -- Visitor and Staff share one shape; a
        Visitor's password-adjacent fields are simply never populated.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
          nullable: true
        full_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/AccountRoleEnum'
          readOnly: true
        language_preference:
          allOf:
          - $ref: '#/components/schemas/LanguagePreferenceEnum'
          readOnly: true
        active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - active
      - created_at
      - email
      - full_name
      - id
      - language_preference
      - phone
      - role
    AccountRoleEnum:
      enum:
      - visitor
      - cashier
      - museum_manager
      - platform_admin
      type: string
      description: |-
        * `visitor` - Visitor
        * `cashier` - Cashier
        * `museum_manager` - Museum Manager
        * `platform_admin` - Platform Admin
    AccountUpdate:
      type: object
      description: |-
        `UserUpdateRequest` -- an account may only ever edit its own
        contact/preference fields, never role/active/email (Sec 4.3).
      properties:
        full_name:
          type: string
          maxLength: 255
        phone:
          type: string
          nullable: true
        language_preference:
          $ref: '#/components/schemas/LanguagePreferenceEnum'
    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
        user:
          $ref: '#/components/schemas/Account'
      required:
      - access_token
      - user
    Booking:
      type: object
      description: |-
        `Booking` (Document 04). Read-only -- every mutation goes through
        the Create/Approval/Cancel/Reschedule serializers below and
        services.py, never through this serializer directly.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        reference:
          type: string
          readOnly: true
        visitorId:
          type: string
          format: uuid
          readOnly: true
        categoryId:
          type: string
          format: uuid
          readOnly: true
        categoryNameEn:
          type: string
          readOnly: true
        categoryNameAm:
          type: string
          readOnly: true
        visitDate:
          type: string
          format: date
          readOnly: true
        bookingType:
          type: string
          readOnly: true
        groupName:
          type: string
          readOnly: true
          nullable: true
        groupContactPhone:
          type: string
          readOnly: true
          nullable: true
        visitorName:
          type: string
          readOnly: true
        visitorEmail:
          type: string
          readOnly: true
        visitorPhone:
          type: string
          readOnly: true
          nullable: true
        bookedQuantity:
          type: integer
          readOnly: true
        attendedQuantity:
          type: integer
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/BookingStatusEnum'
          readOnly: true
        approvalStatus:
          type: string
          readOnly: true
          nullable: true
        rescheduledCount:
          type: integer
          readOnly: true
        noticeSentAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        checkoutUrl:
          type: string
          readOnly: true
          nullable: true
        receiptUrl:
          type: string
          readOnly: true
          nullable: true
        ifmisVoucherReference:
          type: string
          readOnly: true
          nullable: true
        reconciliationId:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        totalAmountEtb:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - approvalStatus
      - attendedQuantity
      - bookedQuantity
      - bookingType
      - categoryId
      - categoryNameAm
      - categoryNameEn
      - checkoutUrl
      - createdAt
      - groupContactPhone
      - groupName
      - id
      - ifmisVoucherReference
      - noticeSentAt
      - receiptUrl
      - reconciliationId
      - reference
      - rescheduledCount
      - status
      - totalAmountEtb
      - visitDate
      - visitorEmail
      - visitorId
      - visitorName
      - visitorPhone
    BookingApproval:
      type: object
      description: '`BookingApprovalRequest` -- Museum Manager only (FR-BOOK-003).'
      properties:
        decision:
          $ref: '#/components/schemas/DecisionEnum'
        note:
          type: string
          nullable: true
      required:
      - decision
    BookingCreate:
      type: object
      description: |-
        `BookingCreateRequest` -- FR-BOOK-001 (individual), FR-BOOK-003
        (group). A plain Serializer, not a ModelSerializer: `visitor` is
        supplied by the view from `request.user`, never from the request
        body, and `categoryId`/`bookingType` need their own field names
        mapped onto services.create_booking's kwargs rather than a 1:1 model
        field mapping.
      properties:
        visitDate:
          type: string
          format: date
        categoryId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        bookingType:
          $ref: '#/components/schemas/BookingTypeEnum'
        groupName:
          type: string
          nullable: true
        groupContactPhone:
          type: string
          nullable: true
      required:
      - bookingType
      - categoryId
      - quantity
      - visitDate
    BookingReschedule:
      type: object
      description: '`BookingRescheduleRequest` -- FR-BOOK-007.'
      properties:
        newVisitDate:
          type: string
          format: date
      required:
      - newVisitDate
    BookingStatusEnum:
      enum:
      - awaiting_payment
      - pending_approval
      - pending
      - visited
      - cancelled
      - refunded
      type: string
      description: |-
        * `awaiting_payment` - Awaiting payment
        * `pending_approval` - Pending approval
        * `pending` - Pending
        * `visited` - Visited
        * `cancelled` - Cancelled
        * `refunded` - Refunded
    BookingTypeEnum:
      enum:
      - individual
      - group
      type: string
      description: |-
        * `individual` - Individual
        * `group` - Group
    CashierReconciliation:
      type: object
      description: |-
        `CashierReconciliation` (per-cashier settlement transfer). Read-only
        -- every mutation goes through `services.initiate_reconciliation` /
        `confirm_reconciliation_success` / `confirm_reconciliation_failure`,
        never through this serializer directly.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        cashierId:
          type: string
          format: uuid
          readOnly: true
        amountEtb:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        chapaTransferReference:
          type: string
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/RefundStatusEnum'
          readOnly: true
        initiatedAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        completedAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        transferReceiptUrl:
          type: string
          readOnly: true
          nullable: true
        failureReason:
          type: string
          readOnly: true
          nullable: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - amountEtb
      - cashierId
      - chapaTransferReference
      - completedAt
      - createdAt
      - failureReason
      - id
      - initiatedAt
      - status
      - transferReceiptUrl
    Category:
      type: object
      description: |-
        `Category` (Document 04) -- FR-CAT-001. Read-only: every mutation
        goes through Create/Update below and services.py, never through this
        serializer directly.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name_en:
          type: string
          readOnly: true
        name_am:
          type: string
          readOnly: true
        price_etb:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        is_free:
          type: boolean
          readOnly: true
        active:
          type: boolean
          readOnly: true
      required:
      - active
      - id
      - is_free
      - name_am
      - name_en
      - price_etb
    CategoryCreate:
      type: object
      description: '`CategoryCreateRequest` -- Museum Manager only (FR-CAT-002).'
      properties:
        name_en:
          type: string
        name_am:
          type: string
        price_etb:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        is_free:
          type: boolean
      required:
      - name_am
      - name_en
      - price_etb
    CategoryUpdate:
      type: object
      description: |-
        `CategoryUpdateRequest` -- Museum Manager only (FR-CAT-002). Every
        field is optional since a single PUT here may only be a price change,
        only a retire/reactivate (`active`), or any combination.
      properties:
        name_en:
          type: string
        name_am:
          type: string
        price_etb:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        is_free:
          type: boolean
        active:
          type: boolean
    ChapaTransferWebhook:
      type: object
      description: |-
        Chapa's Transfer (Payout) webhook payload
        (https://developer.chapa.co/integrations/webhooks -- `"type":
        "Payout"` events, e.g. `event: "payout.success"`). Only `reference`/
        `status` are validated here -- mirrors
        `apps.payments.serializers.ChapaWebhookSerializer`'s own choice to
        model just the two fields the service layer actually branches on and
        pass the rest of the payload through as-is. `reference` is the value
        *we* supplied when calling the Transfer API
        (`services.call_chapa_transfer_api` sends `str(reconciliation.id)`),
        which Chapa echoes back unchanged -- that's what
        `services.handle_chapa_transfer_webhook` looks the row up by, not
        `chapa_reference` (Chapa's own internal id for the transfer, stored
        for reference but never used as a lookup key).
      properties:
        event:
          type: string
          nullable: true
        reference:
          type: string
        status:
          type: string
          nullable: true
        chapa_reference:
          type: string
          nullable: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        currency:
          type: string
          nullable: true
      required:
      - reference
    ChapaWebhook:
      type: object
      description: |-
        `ChapaWebhookPayload` (Document 04). Only `tx_ref`/`status` are
        validated here -- Chapa's payload carries additional fields as needed
        (Document 04's `additionalProperties: true`), which `services.
        confirm_payment_from_webhook` stores as-is in `payment.webhook_payload`
        (`request.data`, not `validated_data`) rather than having every field
        modeled here.
      properties:
        tx_ref:
          type: string
        status:
          type: string
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        currency:
          type: string
          nullable: true
      required:
      - status
      - tx_ref
    CheckInRequest:
      type: object
      description: |-
        `CheckInRequest` (Document 04) -- FR-TICKET-001. `attendedQuantity`
        may be 0 (nobody in the party showed up) but never negative; the
        upper bound (must not exceed bookedQuantity, FR-TICKET-005) is a
        cross-field business rule against the booking being checked in, not a
        field-level constraint this serializer can express on its own -- that
        check lives in services.check_in_booking.
      properties:
        attendedQuantity:
          type: integer
          minimum: 0
      required:
      - attendedQuantity
    CheckInResponse:
      type: object
      description: |-
        `Booking`, extended with the IFMIS voucher-prep fields the Cashier
        needs to key into IFMIS herself at the moment of check-in (per the
        IFMIS decision: the platform never calls IFMIS -- it only gives her
        the exact fields to copy in). Returned only from `POST
        /bookings/{id}/check-in` -- every other endpoint that returns a
        `Booking` keeps using the plain `BookingSerializer`, since these
        fields are only meaningful right after a check-in action, not as a
        general-purpose booking field.

        All four are derived read-only from data `check_in_booking` already
        wrote (or that existed on the booking beforehand) -- nothing here
        changes `check_in_booking`'s own business logic or return value; this
        serializer only shapes its *response* representation.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        reference:
          type: string
          readOnly: true
        visitorId:
          type: string
          format: uuid
          readOnly: true
        categoryId:
          type: string
          format: uuid
          readOnly: true
        categoryNameEn:
          type: string
          readOnly: true
        categoryNameAm:
          type: string
          readOnly: true
        visitDate:
          type: string
          format: date
          readOnly: true
        bookingType:
          type: string
          readOnly: true
        groupName:
          type: string
          readOnly: true
          nullable: true
        groupContactPhone:
          type: string
          readOnly: true
          nullable: true
        visitorName:
          type: string
          readOnly: true
        visitorEmail:
          type: string
          readOnly: true
        visitorPhone:
          type: string
          readOnly: true
          nullable: true
        bookedQuantity:
          type: integer
          readOnly: true
        attendedQuantity:
          type: integer
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/BookingStatusEnum'
          readOnly: true
        approvalStatus:
          type: string
          readOnly: true
          nullable: true
        rescheduledCount:
          type: integer
          readOnly: true
        noticeSentAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        checkoutUrl:
          type: string
          readOnly: true
          nullable: true
        receiptUrl:
          type: string
          readOnly: true
          nullable: true
        ifmisVoucherReference:
          type: string
          readOnly: true
          nullable: true
        reconciliationId:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        totalAmountEtb:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        payerName:
          type: string
          readOnly: true
        amountFigures:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        amountWords:
          type: string
          readOnly: true
        ifmisPurpose:
          type: string
          readOnly: true
      required:
      - amountFigures
      - amountWords
      - approvalStatus
      - attendedQuantity
      - bookedQuantity
      - bookingType
      - categoryId
      - categoryNameAm
      - categoryNameEn
      - checkoutUrl
      - createdAt
      - groupContactPhone
      - groupName
      - id
      - ifmisPurpose
      - ifmisVoucherReference
      - noticeSentAt
      - payerName
      - receiptUrl
      - reconciliationId
      - reference
      - rescheduledCount
      - status
      - totalAmountEtb
      - visitDate
      - visitorEmail
      - visitorId
      - visitorName
      - visitorPhone
    Dashboard:
      type: object
      description: '`GET /reports/dashboard` response shape (FR-REPORT-001).'
      properties:
        revenueTotalEtb:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        visitorCountsByCategory:
          type: object
          additionalProperties:
            type: integer
        groupVsIndividualSplit:
          $ref: '#/components/schemas/GroupVsIndividualSplit'
        statusMix:
          $ref: '#/components/schemas/StatusMix'
      required:
      - groupVsIndividualSplit
      - revenueTotalEtb
      - statusMix
      - visitorCountsByCategory
    DateAvailability:
      type: object
      description: |-
        `DateAvailability` (Document 04). Read-only -- every mutation goes
        through `DateAvailabilityUpdateSerializer` and services.py.
      properties:
        date:
          type: string
          format: date
        isOpenForBooking:
          type: boolean
        closedByUserId:
          type: string
          format: uuid
          nullable: true
        closedAt:
          type: string
          format: date-time
          nullable: true
      required:
      - closedAt
      - closedByUserId
      - date
      - isOpenForBooking
    DateAvailabilityUpdate:
      type: object
      description: '`DateAvailabilityUpdateRequest` -- Museum Manager only (FR-BOOK-008).'
      properties:
        isOpenForBooking:
          type: boolean
      required:
      - isOpenForBooking
    DecisionEnum:
      enum:
      - approve
      - decline
      type: string
      description: |-
        * `approve` - approve
        * `decline` - decline
    DetailResponse:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    ForgotPassword:
      type: object
      description: '`ForgotPasswordRequest` -- Staff only (FR-ACC-006).'
      properties:
        email:
          type: string
          format: email
      required:
      - email
    GroupVsIndividualSplit:
      type: object
      properties:
        group:
          type: integer
        individual:
          type: integer
      required:
      - group
      - individual
    LanguagePreferenceEnum:
      enum:
      - en
      - am
      type: string
      description: |-
        * `en` - English
        * `am` - Amharic
    OutstandingBalance:
      type: object
      description: |-
        `GET /settlement/my-balance/` response shape. Wraps a plain
        Decimal (the return value of `services.get_outstanding_balance`) --
        there is no model behind this endpoint, it's a computed figure, so a
        plain `Serializer` over a `{"balance_etb": ...}` dict is used rather
        than a `ModelSerializer`.
      properties:
        balanceEtb:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - balanceEtb
    PaginatedAccountList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        meta:
          type: object
          properties:
            limit:
              type: integer
            offset:
              type: integer
            total:
              type: integer
          required:
          - limit
          - offset
          - total
      required:
      - data
      - meta
    PaginatedBookingList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Booking'
        meta:
          type: object
          properties:
            limit:
              type: integer
            offset:
              type: integer
            total:
              type: integer
          required:
          - limit
          - offset
          - total
      required:
      - data
      - meta
    PaginatedCashierReconciliationList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CashierReconciliation'
        meta:
          type: object
          properties:
            limit:
              type: integer
            offset:
              type: integer
            total:
              type: integer
          required:
          - limit
          - offset
          - total
      required:
      - data
      - meta
    PaginatedCategoryList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        meta:
          type: object
          properties:
            limit:
              type: integer
            offset:
              type: integer
            total:
              type: integer
          required:
          - limit
          - offset
          - total
      required:
      - data
      - meta
    PaginatedRefundList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Refund'
        meta:
          type: object
          properties:
            limit:
              type: integer
            offset:
              type: integer
            total:
              type: integer
          required:
          - limit
          - offset
          - total
      required:
      - data
      - meta
    PatchedIfmisVoucherUpdate:
      type: object
      description: |-
        `IfmisVoucherUpdateRequest` -- Cashier only. The real Document
        No/Ref No she gets back from IFMIS after keying the check-in
        transaction in herself (services.record_ifmis_voucher_reference
        enforces the "same cashier, settable once" rule -- this serializer is
        field-shape validation only).
      properties:
        voucherReference:
          type: string
          maxLength: 255
    PeriodEnum:
      enum:
      - daily
      - weekly
      - monthly
      - yearly
      type: string
      description: |-
        * `daily` - daily
        * `weekly` - weekly
        * `monthly` - monthly
        * `yearly` - yearly
    ReasonEnum:
      enum:
      - cancellation
      - partial_shortfall
      - no_response
      type: string
      description: |-
        * `cancellation` - Cancellation
        * `partial_shortfall` - Partial shortfall
        * `no_response` - No response
    Refund:
      type: object
      description: |-
        `Refund` (Document 04). Read-only -- every mutation goes through
        `RefundRequestCreateSerializer` and services.py, never through this
        serializer directly.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        bookingId:
          type: string
          format: uuid
          readOnly: true
        amountEtb:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        reason:
          allOf:
          - $ref: '#/components/schemas/ReasonEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/RefundStatusEnum'
          readOnly: true
        chapaRefundReference:
          type: string
          readOnly: true
          nullable: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - amountEtb
      - bookingId
      - chapaRefundReference
      - createdAt
      - id
      - reason
      - status
    RefundRequestCreate:
      type: object
      description: |-
        `RefundRequestCreate` (Document 04) -- FR-TICKET-002/FR-REFUND-001b.
        `note` is free-text context supplied with a shortfall request
        (Document 05 Sec 3.5's `refund.note` column).
      properties:
        note:
          type: string
          nullable: true
    RefundStatusEnum:
      enum:
      - pending
      - completed
      - failed
      type: string
      description: |-
        * `pending` - Pending
        * `completed` - Completed
        * `failed` - Failed
    ReportSummary:
      type: object
      description: |-
        `GET /reports/summary` response shape (FR-REPORT-002). "Yearly"
        follows the organization's fiscal calendar, not Jan-Dec -- see
        `services.resolve_period_range`.
      properties:
        period:
          $ref: '#/components/schemas/PeriodEnum'
        to:
          type: string
          format: date
        revenueByCategory:
          type: object
          additionalProperties:
            type: string
            format: decimal
            pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        visitorCountsByGroup:
          type: object
          additionalProperties:
            type: integer
        from:
          type: string
          format: date
      required:
      - from
      - period
      - revenueByCategory
      - to
      - visitorCountsByGroup
    ResetPassword:
      type: object
      description: '`ResetPasswordRequest` -- Staff only (FR-ACC-006).'
      properties:
        token:
          type: string
        new_password:
          type: string
          writeOnly: true
      required:
      - new_password
      - token
    StaffCreate:
      type: object
      description: |-
        `StaffCreateRequest` (Document 04) -- FR-ACC-002, Platform Admin
        only. No `password` field: services.create_staff_account provisions
        the account with no usable password and sends a set-password link
        instead (FR-ACC-006's flow, reused).
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
          default: ''
          maxLength: 32
        full_name:
          type: string
          maxLength: 255
        role:
          $ref: '#/components/schemas/StaffRoleEnum'
      required:
      - email
      - full_name
      - role
    StaffLogin:
      type: object
      description: '`LoginRequest` -- Staff only (FR-ACC-002, FR-ACC-005).'
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    StaffRoleEnum:
      enum:
      - cashier
      - museum_manager
      type: string
      description: |-
        * `cashier` - Cashier
        * `museum_manager` - Museum Manager
    StaffUpdate:
      type: object
      description: |-
        `StaffUpdateRequest` (Document 04) -- FR-ACC-002, Platform Admin
        only. Every field optional: a single `PUT` may change only `role`,
        only `active`, or both.
      properties:
        role:
          $ref: '#/components/schemas/StaffRoleEnum'
        active:
          type: boolean
    StatusMix:
      type: object
      properties:
        pending:
          type: integer
        visited:
          type: integer
        cancelled:
          type: integer
        refunded:
          type: integer
      required:
      - cancelled
      - pending
      - refunded
      - visited
    TokenRefreshResponse:
      type: object
      properties:
        access:
          type: string
      required:
      - access
    VisitorVerifyConfirm:
      type: object
      description: '`VisitorVerifyConfirmRequest`.'
      properties:
        verification_id:
          type: string
          format: uuid
        otp_code:
          type: string
          maxLength: 6
          minLength: 6
      required:
      - otp_code
      - verification_id
    VisitorVerifyStart:
      type: object
      description: |-
        `VisitorVerifyStartRequest` (Document 04) -- FR-ACC-001, FR-ACC-003.
        No password field exists here or anywhere in the Visitor path.
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
          maxLength: 32
        full_name:
          type: string
          default: ''
          maxLength: 255
        language_preference:
          $ref: '#/components/schemas/LanguagePreferenceEnum'
      required:
      - email
      - phone
    VisitorVerifyStartResponse:
      type: object
      properties:
        verification_id:
          type: string
          format: uuid
        otp_expires_in_seconds:
          type: integer
      required:
      - otp_expires_in_seconds
      - verification_id
  securitySchemes:
    TokenVersionAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
