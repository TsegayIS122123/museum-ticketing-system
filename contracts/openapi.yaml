openapi: 3.0.3
info:
  title: Museum Ticketing & Booking Platform API
  version: 1.0.0
  description: Bilingual (EN/AM) online booking, payment, and gate check-in for the
    Science Museum's digital ticketing track.
paths:
  /api/v1/auth/forgot-password/:
    post:
      operationId: v1_auth_forgot_password_create
      description: |-
        POST /auth/forgot-password -- Staff only (FR-ACC-006). Always 200;
        see services.request_password_reset for why.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ForgotPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ForgotPassword'
        required: true
      security:
      - TokenVersionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: POST /auth/login -- Staff only (FR-ACC-002, FR-ACC-005).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StaffLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffLogin'
        required: true
      security:
      - TokenVersionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/reset-password/:
    post:
      operationId: v1_auth_reset_password_create
      description: POST /auth/reset-password -- Staff only (FR-ACC-006).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResetPassword'
        required: true
      security:
      - TokenVersionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/v1/auth/visitor/verify/confirm/:
    post:
      operationId: v1_auth_visitor_verify_confirm_create
      description: |-
        POST /auth/visitor/verify/confirm -- completes Visitor verification
        and issues the same token pair Staff login does (Sec 4.1).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitorVerifyConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VisitorVerifyConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VisitorVerifyConfirm'
        required: true
      security:
      - TokenVersionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/visitor/verify/email/{token}/:
    get:
      operationId: v1_auth_visitor_verify_email_retrieve
      description: |-
        GET /auth/visitor/verify/email/{token} -- the secondary/fallback
        verification channel (Sec 4.1 step 2). Opening this link marks
        `email_verified_at` but never issues a session on its own; only the
        OTP path above does that.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/v1/auth/visitor/verify/start/:
    post:
      operationId: v1_auth_visitor_verify_start_create
      description: |-
        POST /auth/visitor/verify/start (FR-ACC-001, FR-ACC-003, FR-ACC-004).
        Used for both a first-time booking and a returning Visitor looking up
        their history -- there is no separate "login" for a Visitor.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitorVerifyStart'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VisitorVerifyStart'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VisitorVerifyStart'
        required: true
      security:
      - TokenVersionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorVerifyStartResponse'
          description: ''
  /api/v1/users/me/:
    get:
      operationId: v1_users_me_retrieve
      description: |-
        GET/PUT /users/me -- Visitor and Staff share this endpoint; there is
        no scoped RBAC to check beyond "is this account authenticated" (Sec 4.3).
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
    put:
      operationId: v1_users_me_update
      description: |-
        GET/PUT /users/me -- Visitor and Staff share this endpoint; there is
        no scoped RBAC to check beyond "is this account authenticated" (Sec 4.3).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
components:
  schemas:
    Account:
      type: object
      description: |-
        `UserProfile` (Document 04) -- Visitor and Staff share one shape; a
        Visitor's password-adjacent fields are simply never populated.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
          nullable: true
        full_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        language_preference:
          allOf:
          - $ref: '#/components/schemas/LanguagePreferenceEnum'
          readOnly: true
        active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - active
      - created_at
      - email
      - full_name
      - id
      - language_preference
      - phone
      - role
    AccountUpdate:
      type: object
      description: |-
        `UserUpdateRequest` -- an account may only ever edit its own
        contact/preference fields, never role/active/email (Sec 4.3).
      properties:
        full_name:
          type: string
          maxLength: 255
        phone:
          type: string
          nullable: true
        language_preference:
          $ref: '#/components/schemas/LanguagePreferenceEnum'
    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        user:
          $ref: '#/components/schemas/Account'
      required:
      - access_token
      - refresh_token
      - user
    DetailResponse:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    ForgotPassword:
      type: object
      description: '`ForgotPasswordRequest` -- Staff only (FR-ACC-006).'
      properties:
        email:
          type: string
          format: email
      required:
      - email
    LanguagePreferenceEnum:
      enum:
      - en
      - am
      type: string
      description: |-
        * `en` - English
        * `am` - Amharic
    ResetPassword:
      type: object
      description: '`ResetPasswordRequest` -- Staff only (FR-ACC-006).'
      properties:
        token:
          type: string
        new_password:
          type: string
          writeOnly: true
      required:
      - new_password
      - token
    RoleEnum:
      enum:
      - visitor
      - cashier
      - museum_manager
      - platform_admin
      type: string
      description: |-
        * `visitor` - Visitor
        * `cashier` - Cashier
        * `museum_manager` - Museum Manager
        * `platform_admin` - Platform Admin
    StaffLogin:
      type: object
      description: '`LoginRequest` -- Staff only (FR-ACC-002, FR-ACC-005).'
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    VisitorVerifyConfirm:
      type: object
      description: '`VisitorVerifyConfirmRequest`.'
      properties:
        verification_id:
          type: string
          format: uuid
        otp_code:
          type: string
          maxLength: 6
          minLength: 6
      required:
      - otp_code
      - verification_id
    VisitorVerifyStart:
      type: object
      description: |-
        `VisitorVerifyStartRequest` (Document 04) -- FR-ACC-001, FR-ACC-003.
        No password field exists here or anywhere in the Visitor path.
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
          maxLength: 32
        full_name:
          type: string
          default: ''
          maxLength: 255
        language_preference:
          $ref: '#/components/schemas/LanguagePreferenceEnum'
      required:
      - email
      - phone
    VisitorVerifyStartResponse:
      type: object
      properties:
        verification_id:
          type: string
          format: uuid
        otp_expires_in_seconds:
          type: integer
      required:
      - otp_expires_in_seconds
      - verification_id
  securitySchemes:
    TokenVersionAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
