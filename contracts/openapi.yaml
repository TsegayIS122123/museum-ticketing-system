openapi: 3.0.3
info:
  title: Museum Ticketing & Booking Platform API
  version: 1.0.0
  description: Bilingual (EN/AM) online booking, payment, and gate check-in for the
    Science Museum's digital ticketing track.
paths:
  /api/v1/auth/forgot-password/:
    post:
      operationId: v1_auth_forgot_password_create
      description: |-
        POST /auth/forgot-password -- Staff only (FR-ACC-006). Always 200;
        see services.request_password_reset for why.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ForgotPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ForgotPassword'
        required: true
      security:
      - TokenVersionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: POST /auth/login -- Staff only (FR-ACC-002, FR-ACC-005).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StaffLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffLogin'
        required: true
      security:
      - TokenVersionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/reset-password/:
    post:
      operationId: v1_auth_reset_password_create
      description: POST /auth/reset-password -- Staff only (FR-ACC-006).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResetPassword'
        required: true
      security:
      - TokenVersionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/v1/auth/visitor/verify/confirm/:
    post:
      operationId: v1_auth_visitor_verify_confirm_create
      description: |-
        POST /auth/visitor/verify/confirm -- completes Visitor verification
        and issues the same token pair Staff login does (Sec 4.1).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitorVerifyConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VisitorVerifyConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VisitorVerifyConfirm'
        required: true
      security:
      - TokenVersionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/visitor/verify/email/{token}/:
    get:
      operationId: v1_auth_visitor_verify_email_retrieve
      description: |-
        GET /auth/visitor/verify/email/{token} -- the secondary/fallback
        verification channel (Sec 4.1 step 2). Opening this link marks
        `email_verified_at` but never issues a session on its own; only the
        OTP path above does that.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/v1/auth/visitor/verify/start/:
    post:
      operationId: v1_auth_visitor_verify_start_create
      description: |-
        POST /auth/visitor/verify/start (FR-ACC-001, FR-ACC-003, FR-ACC-004).
        Used for both a first-time booking and a returning Visitor looking up
        their history -- there is no separate "login" for a Visitor.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitorVerifyStart'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VisitorVerifyStart'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VisitorVerifyStart'
        required: true
      security:
      - TokenVersionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorVerifyStartResponse'
          description: ''
  /api/v1/availability/:
    get:
      operationId: v1_availability_list
      description: GET /availability -- public (FR-BOOK-008).
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DateAvailability'
          description: ''
  /api/v1/availability/{date}/:
    put:
      operationId: v1_availability_update
      description: PUT /availability/{date} -- Museum Manager only (FR-BOOK-008).
      parameters:
      - in: path
        name: date
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DateAvailabilityUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DateAvailabilityUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DateAvailabilityUpdate'
        required: true
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DateAvailability'
          description: ''
  /api/v1/bookings/:
    get:
      operationId: listBookings
      description: |-
        GET /bookings (Staff only) and POST /bookings (Visitor only,
        FR-BOOK-001/FR-BOOK-003).
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
    post:
      operationId: createBooking
      description: |-
        GET /bookings (Staff only) and POST /bookings (Visitor only,
        FR-BOOK-001/FR-BOOK-003).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingCreate'
        required: true
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/bookings/{id}/:
    get:
      operationId: getBooking
      description: GET /bookings/{id} -- the owning Visitor or any Staff member.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/bookings/{id}/approval/:
    put:
      operationId: v1_bookings_approval_update
      description: PUT /bookings/{id}/approval -- Museum Manager only (FR-BOOK-003).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingApproval'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingApproval'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingApproval'
        required: true
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/bookings/{id}/cancel/:
    post:
      operationId: v1_bookings_cancel_create
      description: POST /bookings/{id}/cancel -- FR-BOOK-005/006.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/bookings/{id}/reschedule/:
    post:
      operationId: v1_bookings_reschedule_create
      description: POST /bookings/{id}/reschedule -- FR-BOOK-007.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingReschedule'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingReschedule'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingReschedule'
        required: true
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/categories/:
    get:
      operationId: v1_categories_list
      description: |-
        GET /categories (FR-CAT-001, public, no auth) and POST /categories
        (FR-CAT-002, Museum Manager only).
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryList'
          description: ''
    post:
      operationId: v1_categories_create
      description: |-
        GET /categories (FR-CAT-001, public, no auth) and POST /categories
        (FR-CAT-002, Museum Manager only).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
        required: true
      security:
      - TokenVersionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryCreate'
          description: ''
  /api/v1/categories/{id}/:
    put:
      operationId: v1_categories_update
      description: |-
        PUT /categories/{id} and DELETE /categories/{id} -- both Museum
        Manager only (FR-CAT-002). No GET here: Document 04 has no single-
        category retrieve endpoint, only the list at /categories.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    delete:
      operationId: v1_categories_destroy
      description: |-
        PUT /categories/{id} and DELETE /categories/{id} -- both Museum
        Manager only (FR-CAT-002). No GET here: Document 04 has no single-
        category retrieve endpoint, only the list at /categories.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/users/me/:
    get:
      operationId: v1_users_me_retrieve
      description: |-
        GET/PUT /users/me -- Visitor and Staff share this endpoint; there is
        no scoped RBAC to check beyond "is this account authenticated" (Sec 4.3).
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
    put:
      operationId: v1_users_me_update
      description: |-
        GET/PUT /users/me -- Visitor and Staff share this endpoint; there is
        no scoped RBAC to check beyond "is this account authenticated" (Sec 4.3).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
  /api/v1/users/me/bookings/:
    get:
      operationId: listMyBookings
      description: |-
        GET /users/me/bookings -- FR-ACC-004. Mounted at the root URLconf
        (config/urls.py), not here, mirroring CurrentUserView's placement --
        Document 04 puts this under `/users/`, not `/bookings/`.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - v1
      security:
      - TokenVersionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingList'
          description: ''
components:
  schemas:
    Account:
      type: object
      description: |-
        `UserProfile` (Document 04) -- Visitor and Staff share one shape; a
        Visitor's password-adjacent fields are simply never populated.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
          nullable: true
        full_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        language_preference:
          allOf:
          - $ref: '#/components/schemas/LanguagePreferenceEnum'
          readOnly: true
        active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - active
      - created_at
      - email
      - full_name
      - id
      - language_preference
      - phone
      - role
    AccountUpdate:
      type: object
      description: |-
        `UserUpdateRequest` -- an account may only ever edit its own
        contact/preference fields, never role/active/email (Sec 4.3).
      properties:
        full_name:
          type: string
          maxLength: 255
        phone:
          type: string
          nullable: true
        language_preference:
          $ref: '#/components/schemas/LanguagePreferenceEnum'
    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        user:
          $ref: '#/components/schemas/Account'
      required:
      - access_token
      - refresh_token
      - user
    Booking:
      type: object
      description: |-
        `Booking` (Document 04). Read-only -- every mutation goes through
        the Create/Approval/Cancel/Reschedule serializers below and
        services.py, never through this serializer directly.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        reference:
          type: string
          readOnly: true
        visitorId:
          type: string
          format: uuid
          readOnly: true
        categoryId:
          type: string
          format: uuid
          readOnly: true
        visitDate:
          type: string
          format: date
          readOnly: true
        bookingType:
          type: string
          readOnly: true
        groupName:
          type: string
          readOnly: true
          nullable: true
        bookedQuantity:
          type: integer
          readOnly: true
        attendedQuantity:
          type: integer
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        approvalStatus:
          type: string
          readOnly: true
          nullable: true
        rescheduledCount:
          type: integer
          readOnly: true
        noticeSentAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        checkoutUrl:
          type: string
          readOnly: true
          nullable: true
        receiptUrl:
          type: string
          readOnly: true
          nullable: true
        totalAmountEtb:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - approvalStatus
      - attendedQuantity
      - bookedQuantity
      - bookingType
      - categoryId
      - checkoutUrl
      - createdAt
      - groupName
      - id
      - noticeSentAt
      - receiptUrl
      - reference
      - rescheduledCount
      - status
      - totalAmountEtb
      - visitDate
      - visitorId
    BookingApproval:
      type: object
      description: '`BookingApprovalRequest` -- Museum Manager only (FR-BOOK-003).'
      properties:
        decision:
          $ref: '#/components/schemas/DecisionEnum'
        note:
          type: string
          nullable: true
      required:
      - decision
    BookingCreate:
      type: object
      description: |-
        `BookingCreateRequest` -- FR-BOOK-001 (individual), FR-BOOK-003
        (group). A plain Serializer, not a ModelSerializer: `visitor` is
        supplied by the view from `request.user`, never from the request
        body, and `categoryId`/`bookingType` need their own field names
        mapped onto services.create_booking's kwargs rather than a 1:1 model
        field mapping.
      properties:
        visitDate:
          type: string
          format: date
        categoryId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        bookingType:
          $ref: '#/components/schemas/BookingTypeEnum'
        groupName:
          type: string
          nullable: true
        groupContactPhone:
          type: string
          nullable: true
      required:
      - bookingType
      - categoryId
      - quantity
      - visitDate
    BookingReschedule:
      type: object
      description: '`BookingRescheduleRequest` -- FR-BOOK-007.'
      properties:
        newVisitDate:
          type: string
          format: date
      required:
      - newVisitDate
    BookingTypeEnum:
      enum:
      - individual
      - group
      type: string
      description: |-
        * `individual` - Individual
        * `group` - Group
    Category:
      type: object
      description: |-
        `Category` (Document 04) -- FR-CAT-001. Read-only: every mutation
        goes through Create/Update below and services.py, never through this
        serializer directly.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name_en:
          type: string
          readOnly: true
        name_am:
          type: string
          readOnly: true
        price_etb:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        is_free:
          type: boolean
          readOnly: true
        active:
          type: boolean
          readOnly: true
      required:
      - active
      - id
      - is_free
      - name_am
      - name_en
      - price_etb
    CategoryCreate:
      type: object
      description: '`CategoryCreateRequest` -- Museum Manager only (FR-CAT-002).'
      properties:
        name_en:
          type: string
        name_am:
          type: string
        price_etb:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        is_free:
          type: boolean
      required:
      - name_am
      - name_en
      - price_etb
    CategoryUpdate:
      type: object
      description: |-
        `CategoryUpdateRequest` -- Museum Manager only (FR-CAT-002). Every
        field is optional since a single PUT here may only be a price change,
        only a retire/reactivate (`active`), or any combination.
      properties:
        name_en:
          type: string
        name_am:
          type: string
        price_etb:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        is_free:
          type: boolean
        active:
          type: boolean
    DateAvailability:
      type: object
      description: |-
        `DateAvailability` (Document 04). Read-only -- every mutation goes
        through `DateAvailabilityUpdateSerializer` and services.py.
      properties:
        date:
          type: string
          format: date
        isOpenForBooking:
          type: boolean
        closedByUserId:
          type: string
          format: uuid
          nullable: true
        closedAt:
          type: string
          format: date-time
          nullable: true
      required:
      - closedAt
      - closedByUserId
      - date
      - isOpenForBooking
    DateAvailabilityUpdate:
      type: object
      description: '`DateAvailabilityUpdateRequest` -- Museum Manager only (FR-BOOK-008).'
      properties:
        isOpenForBooking:
          type: boolean
      required:
      - isOpenForBooking
    DecisionEnum:
      enum:
      - approve
      - decline
      type: string
      description: |-
        * `approve` - approve
        * `decline` - decline
    DetailResponse:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    ForgotPassword:
      type: object
      description: '`ForgotPasswordRequest` -- Staff only (FR-ACC-006).'
      properties:
        email:
          type: string
          format: email
      required:
      - email
    LanguagePreferenceEnum:
      enum:
      - en
      - am
      type: string
      description: |-
        * `en` - English
        * `am` - Amharic
    PaginatedBookingList:
      type: object
      properties:
        data:
          type: array
          items:
            type: array
            items:
              $ref: '#/components/schemas/Booking'
        meta:
          type: object
          properties:
            limit:
              type: integer
            offset:
              type: integer
            total:
              type: integer
